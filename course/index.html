<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<title>8 本书 · 学习路线</title>
<style>
  :root{--bg:#f7f9fc;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--accent:#2563eb;--ok:#059669}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:"Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif}
  #app{display:flex;height:100%}
  aside{width:300px;flex:0 0 300px;background:#fff;border-right:1px solid var(--line);
    display:flex;flex-direction:column;overflow:auto}
  aside .top{padding:14px 16px 12px;border-bottom:1px solid #eef2f7}
  .tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
  .tab{text-align:center;font-size:12.5px;padding:8px 0;border-radius:9px;cursor:pointer;
    border:1px solid #dbe3ee;color:#475569;background:#fff;font-weight:600}
  .tab.on{background:#0f172a;color:#fff;border-color:#0f172a}
  .tab.wide{grid-column:1 / -1}
  aside h1{font-size:15px;margin:0 0 4px;font-weight:700}
  aside .sub{font-size:11.5px;color:var(--muted);line-height:1.6}
  .bar{height:6px;background:#eef2f7;border-radius:6px;margin-top:12px;overflow:hidden}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#60a5fa,#2563eb);width:0;transition:width .3s}
  .pct{font-size:11px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between}
  .pct span:last-child{cursor:pointer;color:#2563eb}
  .stage{padding:13px 16px 6px;font-size:11px;color:#94a3b8;letter-spacing:.6px;font-weight:600}
  .stage .hint{display:block;color:#b6c2d1;font-weight:400;letter-spacing:0;margin-top:3px}
  .lesson{display:flex;gap:10px;align-items:flex-start;padding:9px 16px;cursor:pointer;
    border-left:3px solid transparent;font-size:13px;color:#334155;line-height:1.5}
  .lesson:hover{background:#f8fafc}
  .lesson.active{background:#eff6ff;border-left-color:var(--accent);color:#1d4ed8;font-weight:600}
  .lesson .dot{width:16px;height:16px;border-radius:50%;border:1.5px solid #cbd5e1;flex:0 0 16px;
    margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff}
  .lesson.done .dot{background:var(--ok);border-color:var(--ok)}
  .lesson .meta{display:block;font-size:10.5px;color:#94a3b8;margin-top:3px;font-weight:400}
  main{flex:1;overflow:auto;padding:32px 44px 80px;max-width:920px;margin:0 auto}
  .kicker{font-size:11.5px;color:var(--accent);font-weight:700;letter-spacing:1px}
  h2{font-size:27px;margin:8px 0 6px;letter-spacing:.5px}
  .min{font-size:12px;color:var(--muted);margin-bottom:12px}
  .bookchips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .bchip{font-size:11.5px;padding:5px 10px;border-radius:20px;background:#eef6ff;color:#1d4ed8;
    text-decoration:none;border:1px solid #dbeafe}
  .bchip:hover{background:#dbeafe}
  .hook{background:#fff;border:1px solid #e2e8f0;border-left:4px solid #93c5fd;border-radius:0 12px 12px 0;
    padding:16px 18px;font-size:15px;line-height:1.9;margin-bottom:22px}
  h3{font-size:14px;margin:30px 0 10px;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
  h3::before{content:"";width:5px;height:16px;background:var(--accent);border-radius:3px}
  ul.goals{margin:0;padding-left:20px;font-size:14px;line-height:1.95}
  .concept{background:#fff;border:1px solid #e8eef6;border-radius:12px;padding:14px 16px;margin:10px 0}
  .concept b{font-size:14px}
  .concept em{font-style:normal;color:#94a3b8;font-size:11.5px;margin-left:6px}
  .concept p{margin:6px 0 0;font-size:13.5px;line-height:1.85;color:#334155}
  .step{margin:16px 0}
  .step .txt{font-size:13.6px;line-height:1.8;margin-bottom:8px}
  pre{background:#0f172a;color:#e2e8f0;padding:14px 16px;border-radius:10px;overflow:auto;
    font-family:Consolas,ui-monospace,monospace;font-size:12.6px;line-height:1.65;margin:0}
  .out{font-size:12.6px;color:#047857;background:#ecfdf5;border:1px solid #a7f3d0;
    border-radius:8px;padding:8px 12px;margin-top:8px;font-family:Consolas,monospace}
  details{background:#fff;border:1px solid #e8eef6;border-radius:10px;padding:11px 14px;margin:8px 0;
    font-size:13.6px;line-height:1.8}
  details summary{cursor:pointer;color:#1d4ed8;font-weight:600}
  details[open] summary{margin-bottom:6px}
  .can{background:#f0f9ff;border:1px solid #bae6fd;border-radius:12px;padding:14px 16px;
    font-size:13.6px;line-height:1.8;margin-top:26px}
  .nav{display:flex;gap:12px;margin-top:30px;align-items:center}
  button{font:inherit;font-size:13.5px;padding:11px 20px;border-radius:10px;border:1px solid #cbd5e1;
    background:#fff;cursor:pointer;color:#334155;transition:.15s}
  button:hover{border-color:#94a3b8;background:#f8fafc}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.done{background:var(--ok);border-color:var(--ok);color:#fff}
  .spacer{flex:1}
  /* intro */
  .intro .lead{font-size:17px;line-height:1.95;background:#fff;border:1px solid #e2e8f0;
    border-left:4px solid #2563eb;border-radius:0 12px 12px 0;padding:18px 20px;margin-bottom:22px}
  .intro .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:6px 0 10px}
  .intro .cell{background:#fff;border:1px solid #e8eef6;border-radius:12px;padding:14px 16px;
    font-size:13.4px;line-height:1.85}
  .intro .cell b{display:block;font-size:11px;color:#94a3b8;letter-spacing:1px;margin-bottom:6px}
  .intro .not{background:#fff7ed;border:1px solid #fed7aa;color:#7c2d12;border-radius:12px;
    padding:12px 16px;font-size:13.2px;line-height:1.8;margin-top:14px}
  .intro .start{display:flex;gap:14px;align-items:center;margin-top:26px}
  .readback{margin-top:28px;background:#fcfdff;border:1px solid #e6eef7;border-radius:14px;padding:6px 16px 14px}
  .readback h3{margin:14px 0 8px}
  .rbrow{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;margin:8px 0;border:1px solid #eef2f7;
    border-radius:10px;background:#fff;text-decoration:none;color:#0f172a;transition:.15s}
  .rbrow:hover{border-color:#bfdbfe;transform:translateX(2px)}
  .rbq{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:20px;margin-right:6px;font-weight:600;white-space:nowrap}
.rbw{display:block;font-style:normal;font-size:10.5px;color:#94a3b8;margin-top:2px}
.rbp{font-size:10.5px;padding:3px 8px;border-radius:20px;border:1px solid;white-space:nowrap;font-weight:600;margin-top:1px}
  .rbt{flex:1;font-size:12.8px;line-height:1.6}
  .rbt b{display:block;font-weight:600}
  .rbt i{font-style:normal;color:#64748b;font-size:11.8px}
  .rbg{font-size:11px;color:#94a3b8;white-space:nowrap;margin-top:2px}
  .rbnote{font-size:11.3px;color:#94a3b8;line-height:1.8;margin-top:6px}
  /* read list */
  .bgrid.rgrid{display:block;column-count:2;column-gap:14px}
  .bgrid.rgrid .bcard{display:inline-block;width:100%;margin:0 0 14px;break-inside:avoid;vertical-align:top}
  @media (max-width: 1180px){.bgrid.rgrid{column-count:1}}
  .rrow{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border:1px solid #eef2f7;
    border-radius:10px;margin:7px 0;cursor:pointer;background:#fff;transition:.15s}
  .rrow:hover{border-color:#bfdbfe;background:#f8fbff}
  .rrow.on{background:#f0fdf4;border-color:#a7f3d0}
  .rrow input{margin-top:3px;accent-color:#059669;width:15px;height:15px}
  .rrow .rt{flex:1;font-size:12.6px;line-height:1.65}
  .rrow .rt b{display:block;font-weight:600;color:#0f172a}
  .rrow .rt em{font-style:normal;color:#94a3b8;margin-left:6px;font-size:11px}
  .rrow .rt i{display:block;font-style:normal;color:#64748b;font-size:11.5px;margin-top:2px}
  .rrow .rlink{font-size:11px;color:#2563eb;text-decoration:none;white-space:nowrap;margin-top:2px}
  .rskip{font-size:11.8px;color:#94a3b8;margin-top:8px;line-height:1.7}
  .cnt{float:right;color:#2563eb;font-weight:600;letter-spacing:0}
  .bcard .rlist{margin-top:6px}
  /* books view */
  .bgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
  .bcard{background:#fff;border:1px solid #e6ecf4;border-radius:14px;padding:16px 18px}
  .bcard .code{font-size:11px;color:#94a3b8;letter-spacing:1px}
  .bcard h4{margin:4px 0 8px;font-size:16px}
  .bcard .row{font-size:12.8px;color:#475569;line-height:1.8;margin:2px 0}
  .bcard .row b{color:#0f172a;font-weight:600}
  .bcard a{font-size:12px;color:#2563eb;text-decoration:none}
  .bcard a:hover{text-decoration:underline}
  .note{background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:14px 16px;
    font-size:13.4px;line-height:1.85;color:#7c2d12;margin-top:18px}
</style></head><body>

<script>
const DATA = {"tracks": [{"id": "llm", "name": "LLM 线", "sub": "先建立直觉，再调 API，最后会算账与部署", "stages": [{"id": "llm0", "name": "第 0 阶段 · LLM 是什么", "hint": "不写代码也能懂：它在做什么、里面长什么样、名词怎么对", "lessons": [{"id": "start", "title": "从打开终端开始", "min": 20, "hook": "双击一个文件，它就打开了——但写程序不是双击。你要先学会「在终端里命令电脑做事」，这一步过了，后面才谈得上代码。", "goals": ["打开终端，知道它和鼠标点击的区别", "装好 Python 并跑通第一行输出", "读懂最常见的三种报错，不再一报错就慌", "分清 shell 和 Python 解释器：知道代码该交给谁执行"], "concepts": [{"t": "终端", "en": "terminal", "d": "一个只能打字、不能点的窗口。你输入命令，电脑执行并把结果打在下面。Windows 上叫「命令提示符」或「PowerShell」。"}, {"t": "解释器", "en": "interpreter", "d": "一个能把你的 .py 文件翻译成电脑动作的程序。装了 Python，就等于装了这个解释器。"}, {"t": "报错", "en": "traceback", "d": "程序出错时打印的说明。最后一行是错误类型，往上找第一处「你自己写的文件名」，就是出事的地方。"}], "steps": [{"text": "按 Win 键，输入 powershell，回车。出现一个可以打字的窗口，光标在闪，就对了。", "code": "powershell", "out": "一个没有按钮、只有文字的窗口"}, {"text": "确认电脑里有没有 Python。没有就用下面第一行装（需要联网几分钟）。", "code": "python --version\n# 若提示找不到命令：\nwinget install -e --id Python.Python.3.12", "out": "Python 3.12.x"}, {"text": "新建一个文件 hello.py（记事本另存为，注意后缀是 .py），写一行，然后在终端里运行它。", "code": "print(\"你好\")\n\n# 终端里，先 cd 到文件所在目录，再：\npython hello.py", "out": "你好"}, {"text": "第一个坑：不要在 PowerShell 里直接敲 Python 代码。PowerShell 自己有个 print 命令（意思是「发给打印机」），所以会报「无法初始化设备 PRN」——这不是 Python 的错，是你在错误的窗口里说话。", "code": "print(\"你好\")\n# PowerShell 里的结果：\n# 无法初始化设备 PRN\n\n# 正确做法一：先进入解释器\npython\n>>> print(\"你好\")\n>>> exit()\n\n# 正确做法二：写进 .py 文件再运行\npython hello.py", "out": "你好"}, {"text": "故意写错一次，看报错长什么样——这比跑对更重要。", "code": "print(nihao)", "out": "NameError: name 'nihao' is not defined —— 意思是「没定义过这个名字」"}], "quiz": [{"q": "为什么不能双击 .py 文件来运行？", "a": "双击只是打开编辑器；要让它执行，得用解释器运行（python 文件名）。终端就是你和解释器之间的入口。"}, {"q": "SyntaxError 和 NameError 有什么区别？", "a": "SyntaxError = 语法写错了（少括号、少引号），程序根本没开始跑；NameError = 语法没问题，但你用了一个没定义的名字。"}, {"q": "报错信息那么长，先看哪一行？", "a": "先看最后一行（错误类型和原因），再往上找第一个出现你自己文件名的行号。"}, {"q": "在 PowerShell 里直接敲 print(\"你好\")，为什么报的是「无法初始化设备 PRN」？", "a": "因为 PowerShell 把 print 当成了自己的别名（Out-Printer，发给打印机），代码根本没交给 Python。要么先用 python 进入解释器（>>> 提示符），要么写进 .py 文件用 python 文件名运行。"}], "can": "在终端里跑通自己的第一个程序，遇到报错能说出是哪一类。"}, {"id": "vars", "title": "变量与运算：让电脑替你算数", "min": 20, "hook": "你心算 100 块按 5% 涨一年是多少，大概要三秒；电脑要你先告诉它「100 是多少」，然后它一毫秒给你答案，而且永远不错。", "goals": ["会定义变量、做加减乘除", "知道整数和小数的区别、为什么金额别用小数类型", "会拼接文字和数字"], "concepts": [{"t": "变量", "en": "variable", "d": "贴了名字的盒子。`x = 100` 就是把 100 放进叫 x 的盒子；以后写 x，电脑就去盒子里取。"}, {"t": "运算", "en": "operators", "d": "`+ - * /` 是四则；`*` 是乘不是 x；`**` 是乘方（`1.05 ** 20` 就是 1.05 的 20 次方）。"}, {"t": "字符串", "en": "string", "d": "引号里的文字，比如 `\"你好\"`。它和数字不能直接相加，要先把数字转成文字。"}], "steps": [{"text": "先验证一件事：电脑按数学顺序算，不是从左往右。", "code": "print(2 + 3 * 4)      # 14\nprint((2 + 3) * 4)    # 20", "out": "14 / 20 —— 括号决定谁先算"}, {"text": "用变量算一次复利，改数字再跑一次。", "code": "x = 100\nx = x * 1.05\nprint(x)              # 105.0\n\nx = x * 1.05\nprint(x)              # 110.25", "out": "105.0 / 110.25 —— 第二年的利息是「利息也生息」"}, {"text": "把文字和数字拼在一起，做成一句人话。", "code": "money = 100 * 1.05 ** 20\nprint(\"20 年后：\" + str(round(money, 2)) + \" 元\")", "out": "20 年后：265.33 元 —— 数字要先 str() 才能和文字相加"}], "quiz": [{"q": "`2 + 3 * 4` 为什么不是 20？", "a": "乘除先于加减，等价于 2 + 12 = 14。想先加就写括号。"}, {"q": "`x = x * 1.05` 这一句在干嘛？", "a": "先算右边（旧 x 乘 1.05），再把结果放回 x。变量可以被覆盖，旧值就没了。"}, {"q": "`\"100\"` 和 `100` 有什么区别？", "a": "前者是文字（不能做数学），后者是数字。混用会报 TypeError。"}], "can": "用变量和一行算式，算出任意本金、任意年数下的复利结果。"}, {"id": "control", "title": "条件与重复：让电脑做判断", "min": 20, "hook": "「涨了就买、跌了就卖」——这句话电脑听不懂，除非你把它翻成「如果…就…」。同理，连续 20 年复利，你不该手写 20 行。", "goals": ["会写 if / else 做判断", "会用 for 重复做同一件事", "知道缩进在 Python 里是语法，不是排版"], "concepts": [{"t": "布尔", "en": "bool", "d": "只有两个值：True 和 False。比较的结果就是它：`3 > 2` 得到 True。"}, {"t": "条件", "en": "if / else", "d": "如果条件成立就做 A，否则做 B。`=` 是赋值，`==` 才是比较，写错会静默出错。"}, {"t": "循环", "en": "for", "d": "把同一段代码重复 N 次。`range(3)` 给的是 0、1、2 三个数（从 0 开始）。"}], "steps": [{"text": "先用比较得到 True/False，再用 if 决定做什么。", "code": "r = 0.05\nif r > 0:\n    print(\"上涨\")\nelse:\n    print(\"下跌或持平\")", "out": "上涨 —— 注意缩进 4 个空格，Python 靠它判断层级"}, {"text": "重复 3 次，看看 range 给的到底是什么。", "code": "for i in range(3):\n    print(i)", "out": "0 / 1 / 2 —— 不含 3"}, {"text": "把复利写进循环：想算 50 年，只改一个数字。", "code": "money = 100\nfor year in range(20):\n    money = money * 1.05\nprint(money)", "out": "265.33 —— 想算 50 年就把 20 改成 50"}], "quiz": [{"q": "`range(3)` 会跑几次？分别是几？", "a": "3 次，i 分别是 0、1、2。要 1 到 3 得写 range(1, 4)。"}, {"q": "`=` 和 `==` 有什么区别？", "a": "`=` 是把右边装进左边；`==` 是问「两边相等吗」，返回 True/False。"}, {"q": "为什么 if 下面的代码要缩进？", "a": "Python 用缩进表示「哪些行属于这个 if」。不缩进就跑到 if 外面去了。"}], "can": "把一句自然语言的规则（涨了买、跌了卖）翻成 if/else，并用循环批量算多年。"}, {"id": "llm0a", "title": "LLM 到底在做什么", "min": 25, "hook": "它不查资料、不搜索、也不「思考」。它只做一件事，每秒做几十次：猜下一个词。", "goals": ["用一句话说清 LLM 的工作方式", "知道「字 → token → 数字」这条流水线", "知道参数是什么，以及训练在调什么"], "concepts": [{"t": "下一个词预测", "en": "next-token prediction", "d": "给一段文字，模型算出「下一个词最可能是哪个」，抽一个，再接上去。整段回答就是这样一个个词接出来的。"}, {"t": "词元", "en": "token", "d": "模型不认识「字」，只认识词元：常见词一个 token，生僻词拆成几段。中文一个字常占 1–2 个 token。"}, {"t": "参数", "en": "parameters", "d": "模型里那几百亿个数字。训练就是反复调这些数字，让「猜下一个词」越来越准。7B 表示 70 亿个参数。"}], "steps": [{"text": "先看它「接话」：同一开头，让它续三次，观察多样性。", "code": "for i in range(3):\n    r = client.chat.completions.create(\n        model=\"deepseek-chat\", temperature=1.0,\n        messages=[{\"role\": \"user\", \"content\": \"接着写下去，只写一句：今天的市场\"}],\n    )\n    print(i, r.choices[0].message.content.strip())", "out": "三句话都不一样——因为每次都是「抽一个词、再接一个」，不是查好的答案"}, {"text": "把一句话拆开看长度：一个字和一次「输出」分别花多少 token。", "code": "texts = [\"复利\", \"复利就是把利息也拿来生息\", \"Compound interest means interest earns interest\"]\nfor t in texts:\n    r = client.chat.completions.create(\n        model=\"deepseek-chat\", temperature=0, max_tokens=1,\n        messages=[{\"role\": \"user\", \"content\": t}],\n    )\n    print(len(t), \"字符 ->\", r.usage.prompt_tokens, \"token |\", t[:20])", "out": "字符数和 token 数不成正比——中文一个字常是 1–2 个 token"}, {"text": "让它「只猜一个词」，体会它其实在算概率。", "code": "r = client.chat.completions.create(\n    model=\"deepseek-chat\", temperature=0, max_tokens=1,\n    messages=[{\"role\": \"user\", \"content\": \"中国首都是\"}],\n)\nprint(\"下一个词:\", r.choices[0].message.content)\nprint(\"finish_reason:\", r.choices[0].finish_reason)", "out": "下一个词: 北京 —— 它做的就是这个动作，重复成千上万次"}], "quiz": [{"q": "模型并没有「查资料」，为什么很多事实它答得对？", "a": "因为训练时这些事实大量出现在语料里，参数已经把「北京常接在中国首都后面」这种统计规律记下来了。它是在复现规律，不是查库。"}, {"q": "token 和「字」有什么区别？", "a": "字是人写的单位，token 是模型切分的单位。一个英文词约 1 个 token，一个中文字常 1–2 个；生僻词会被拆成几段。"}, {"q": "7B 模型里的 7B 指什么？", "a": "70 亿个参数（权重数字）。参数越多通常越能记住复杂规律，但推理更慢、显存更大。"}], "can": "用「猜下一个词」解释模型的行为，并说出 token 与参数各是什么。"}, {"id": "llm0b", "title": "模型里面长什么样", "min": 30, "hook": "它是一摞几十层一模一样的积木，每层只做两件事：让词互相看一眼，再各自消化一下。", "goals": ["说清一层 Transformer 的两个部件", "知道「注意力」在干什么（不推公式）", "理解上下文窗口和显存的账为什么这么算"], "concepts": [{"t": "自注意力", "en": "self-attention", "d": "每个词都去问其他词：「你跟我有多相关？」然后按相关度把别人的信息加权汇总到自己身上。「银行」会更多吸收「利率」的信息。"}, {"t": "前馈层", "en": "feed-forward", "d": "每个词单独过一次小网络，做非线性变换。大量「知识」存在这里。注意力和前馈层交替堆叠几十层。"}, {"t": "上下文窗口", "en": "context window", "d": "一次能读进来的 token 上限（输入+输出）。它决定模型「同时能看多少字」，也直接决定显存和费用。"}], "steps": [{"text": "手算一个小注意力：3 个词的「相关度」怎么变成权重。", "code": "import numpy as np\n# 三个词的「向量」（简化为 2 维）\nX = np.array([[1.0, 0.0],   # 利率\n              [0.9, 0.1],   # 银行\n              [0.0, 1.0]])  # 天气\nscores = X @ X.T            # 两两相似度\nw = np.exp(scores) / np.exp(scores).sum(axis=1, keepdims=True)\nnp.set_printoptions(precision=2, suppress=True)\nprint(\"相关度:\\n\", scores)\nprint(\"权重(softmax):\\n\", w)", "out": "「银行」那一行对「利率」的权重明显更大——它会更用力地吸收利率的信息"}, {"text": "看上下文如何改变同一个词的理解。", "code": "for ctx in [\"银行旁边有个公园\", \"银行提高了存款利率\"]:\n    r = client.chat.completions.create(\n        model=\"deepseek-chat\", temperature=0,\n        messages=[{\"role\": \"user\", \"content\": f\"这句话里的「银行」是什么意思？{ctx}\"}],\n    )\n    print(ctx, \"->\", r.choices[0].message.content.strip()[:40])", "out": "同一个词，两种解释——因为注意力把它周围的词吸收进来了"}, {"text": "算一遍参数与显存的账：为什么 7B 要 14 GB。", "code": "params = 7e9\nfor name, bytes_per in [(\"fp16\", 2), (\"int8\", 1), (\"int4\", 0.5)]:\n    print(name, \"权重约\", round(params * bytes_per / 1e9, 1), \"GB\")\nprint(\"还要另外留：KV cache + 中间激活 + 框架开销\")", "out": "fp16 14.0GB / int8 7.0GB / int4 3.5GB——这就是 8GB 显存能跑什么的分界线"}], "quiz": [{"q": "一层 Transformer 里，注意力和前馈层分别负责什么？", "a": "注意力负责「词与词之间传信息」（汇总上下文），前馈层负责「每个词自己消化」（非线性变换、存知识）。两者交替堆叠。"}, {"q": "为什么上下文越长越贵、越慢？", "a": "注意力要让每个词和其他所有词算相关度，长度翻倍计算量约翻四倍；同时 KV cache 占用线性增长，显存也更紧张。"}, {"q": "7B 模型用 int4 量化后约 3.5 GB，为什么实际跑起来还要更多？", "a": "权重只是第一部分，还要 KV cache、激活值和框架开销。上下文越长，KV cache 越大，常常比权重还占地方。"}], "can": "画出一层 Transformer 的两个部件，并解释注意力、上下文窗口和显存的关系。"}, {"id": "llm0c", "title": "二十个名词一次对齐", "min": 25, "hook": "读原文卡住，多半不是数学难，而是名词没对齐：同一个东西，三本书三种叫法。", "goals": ["认得 20 个高频术语的中英文与含义", "能区分最容易混的五组词", "学会遇到生词时的定位方法"], "concepts": [{"t": "推理", "en": "inference", "d": "用训练好的模型生成回答的过程。对应「训练 training」——一个是一次性的大工程，一个是每次调用都在发生的事。"}, {"t": "幻觉", "en": "hallucination", "d": "模型自信地说出不实内容。根源是它在「猜下一个词」而不是「查事实」，流畅性和真实性是两回事。"}, {"t": "嵌入", "en": "embedding", "d": "把文字变成一串数字（向量），意思相近的向量距离近。RAG 检索、聚类、去重都靠它。"}], "steps": [{"text": "先把名词卡建成字典，打印出来背一遍。", "code": "terms = {\n  \"token\": \"词元，模型的最小计价与处理单位\",\n  \"prompt\": \"提示词，你发给模型的全部内容\",\n  \"completion\": \"模型生成的回答\",\n  \"context window\": \"上下文窗口，一次能读的 token 上限\",\n  \"temperature\": \"温度，控制随机性，0 最稳定\",\n  \"top_p\": \"核采样，只从高概率词里抽\",\n  \"inference\": \"推理，用模型生成回答\",\n  \"prefill\": \"预填充，先把 prompt 一次性算完\",\n  \"decode\": \"解码，逐个 token 生成\",\n  \"KV cache\": \"缓存已算过的键值，避免重复计算\",\n  \"embedding\": \"嵌入，把文字变成向量\",\n  \"RAG\": \"检索增强生成，先查资料再回答\",\n  \"fine-tuning\": \"微调，用你的数据继续训练\",\n  \"LoRA\": \"低秩适配，省显存的微调方式\",\n  \"quantization\": \"量化，降低数值精度省显存\",\n  \"hallucination\": \"幻觉，编造不实内容\",\n  \"guardrail\": \"护栏，模型之外的检查层\",\n  \"agent\": \"智能体，能调工具、多步完成任务\",\n  \"TTFT\": \"首字延迟，从发出请求到第一个字\",\n  \"throughput\": \"吞吐，每秒能处理多少 token/请求\",\n}\nfor k, v in terms.items():\n    print(f\"{k:16} {v}\")", "out": "20 行名词卡——遇到不认识的，先回来对一下"}, {"text": "用模型自己做一次「名词标注」，看你哪几个词还不确定。", "code": "para = \"预填充阶段并行处理 prompt，解码阶段逐 token 生成；KV cache 让历史不必重算，量化则降低了权重精度。\"\nr = client.chat.completions.create(\n    model=\"deepseek-chat\", temperature=0,\n    messages=[{\"role\": \"user\", \"content\": f\"把这段话里的专业术语挑出来，逐个用一句话解释：{para}\"}],\n)\nprint(r.choices[0].message.content)", "out": "模型会列出 prefill/decode/KV cache/量化——解释里有你不熟的，回去查书页码"}, {"text": "练「术语 → 书 → 页码」的定位：用课程搜索找到它在哪一章。", "code": "# 在课程里搜索（等价于追问「这个词在哪讲过」）\n# study_search(\"KV cache\")\n# 返回：概念卡 + 章节页码，例如《04 LLM》第 2 章 p.69\nprint(\"遇到生词的固定动作：搜索 → 看概念卡 → 翻对应页\")", "out": "搜索 → 概念卡 → 翻页，三步固定下来，就不用从头读"}], "quiz": [{"q": "「训练」和「推理」最大的区别是什么？", "a": "训练是把参数调好（一次性、极贵、在数据中心）；推理是用调好的参数生成回答（每次调用都在发生）。你平时用 API，用的是推理。"}, {"q": "幻觉和「答错」有什么区别？", "a": "答错可能是知识不足或理解偏差；幻觉是「编造出看似合理但不实的内容」，且语气自信。防幻觉靠检索与核验，不是靠让它「想清楚」。"}, {"q": "微调和 RAG，什么时候用哪个？", "a": "缺知识（资料常更新）用 RAG；缺格式/风格/固定行为用微调。多数业务先上 RAG，微调是后手且成本更高。"}], "can": "认出 20 个高频术语，并能把不会的词定位到书里的具体章节。"}]}, {"id": "l0", "name": "起点 · 零基础三关", "hint": "装 Python、算数、做判断，三关走完再进正课", "lessons": [{"id": "llm1", "title": "Python 只学够用的", "min": 20, "hook": "模型返回的是一段像这样的东西：`{\"content\": \"你好\"}`。你要从里面把「你好」取出来——这只需要字典、取值、和一个小函数。", "goals": ["会建字典、按 key 取值", "会写一个能重复用的小函数", "看得懂 KeyError 是什么意思"], "concepts": [{"t": "字典", "en": "dict", "d": "「名字 → 值」的查表。`d = {\"role\": \"user\", \"content\": \"你好\"}`，用 `d[\"content\"]` 取出「你好」。"}, {"t": "键不存在", "en": "KeyError", "d": "取一个没存过的名字会报错。安全写法是 `d.get(\"content\", \"\")`，取不到就给空字符串。"}, {"t": "函数", "en": "function", "d": "把「发请求 → 取字段」包成名字，以后换一句话就能复用。"}], "steps": [{"text": "建一个最像 API 返回的字典，练取值。", "code": "resp = {\"role\": \"assistant\", \"content\": \"你好\", \"tokens\": 12}\nprint(resp[\"content\"])          # 你好\nprint(resp.get(\"finish\", \"无\"))  # 无（不报错）", "out": "你好 / 无"}, {"text": "写一个函数，专门从这种结构里取正文。", "code": "def get_text(resp):\n    return resp.get(\"content\", \"\")\n\nget_text({\"content\": \"第一段\"})", "out": "第一段"}, {"text": "故意取一个不存在的键，看报错长什么样。", "code": "resp[\"abc\"]", "out": "KeyError: 'abc' —— 从最后一行往上看，就知道错在哪"}], "quiz": [{"q": "`resp.get(\"content\")` 和 `resp[\"content\"]` 有什么区别？", "a": "前者取不到返回 None，不中断程序；后者直接抛 KeyError。解析外部返回的数据时用 get 更安全。"}, {"q": "如果返回的是 `[{...}, {...}]` 这样的列表，怎么取第一条的正文？", "a": "`resp[0][\"content\"]`——先按序号取元素，再按 key 取值。"}, {"q": "为什么要把取字段写成函数，而不是每次都手写？", "a": "换模型、换字段名时只改一处；出错也只有一个地方要查。"}], "can": "拿到任何一段 JSON 响应，都能把想要的字段安全地取出来。"}, {"id": "llm2", "title": "调第一个 API", "min": 25, "hook": "你不需要训练模型，也不需要显卡——只要一个 API key，二十行代码就能让模型替你干活。", "goals": ["装好 SDK、配好 key", "发出第一个请求拿到回答", "理解 system 和 user 两种消息"], "concepts": [{"t": "API key", "en": "api key", "d": "你的身份凭证。**不要写进代码提交到网上**，放进环境变量或 `.env` 文件。"}, {"t": "messages", "en": "messages", "d": "一段对话是一个列表：`system` 定规矩（你是助手），`user` 提问，`assistant` 是模型的回答。"}, {"t": "模型名", "en": "model", "d": "DeepSeek 里 `deepseek-chat` 是通用对话模型，`deepseek-reasoner` 会先推理再回答、更慢更贵。"}], "steps": [{"text": "装 SDK（一条命令），key 放环境变量，不要硬编码。", "code": "pip install openai\n\n# Windows PowerShell：\n$env:DEEPSEEK_API_KEY = \"sk-你的key\"", "out": "装好后 `pip show openai` 能看到版本"}, {"text": "发第一个请求。`base_url` 是关键——同一个 SDK 可以接不同厂商。", "code": "import os\nfrom openai import OpenAI\n\nclient = OpenAI(api_key=os.environ[\"DEEPSEEK_API_KEY\"],\n                base_url=\"https://api.deepseek.com\")\n\nr = client.chat.completions.create(\n    model=\"deepseek-chat\",\n    messages=[{\"role\": \"user\", \"content\": \"用一句话解释什么是 token\"}],\n)\nprint(r.choices[0].message.content)", "out": "一段中文回答"}, {"text": "加上 system 约束，让回答变成「只给结论，不超过 20 字」。", "code": "messages = [\n    {\"role\": \"system\", \"content\": \"你只给结论，不超过 20 字，不解释。\"},\n    {\"role\": \"user\", \"content\": \"什么是 token？\"},\n]\nr = client.chat.completions.create(model=\"deepseek-chat\", messages=messages)\nprint(r.choices[0].message.content)", "out": "更短、更稳定的回答"}], "quiz": [{"q": "为什么 API key 不能写死在代码里？", "a": "代码会被复制、上传、截图。key 泄露后别人可以用你的额度，且很难追溯。"}, {"q": "system 和 user 有什么区别？", "a": "system 是给模型的长期规矩（角色、格式、语气），user 是每次的具体问题。换问题不用改 system。"}, {"q": "`r.choices[0].message.content` 里每一层是什么？", "a": "choices 是候选列表（默认 1 个），[0] 取第一个，message 是回答对象，content 是文本。"}], "can": "在工作机上跑通一次真实调用，并能改成自己的提示词。"}]}, {"id": "l1s", "name": "第 1 阶段 · 会用它", "hint": "token、检索、结构化输出——LLM 应用的三块地基", "lessons": [{"id": "llm3", "title": "数一数 token", "min": 25, "hook": "同一句话，中文账单比英文贵；同样 1000 字，有的模型算 800 token，有的算 1200。钱是按 token 收的，不是按字。", "goals": ["知道 token 不等于字", "会从响应里读用量和成本", "会估算一次任务的费用"], "concepts": [{"t": "token", "en": "token", "d": "模型的最小计价单位。英文一个词约 1 个 token，中文一个字常常 1–2 个 token。"}, {"t": "上下文窗口", "en": "context window", "d": "一次能塞进去的 token 上限（输入 + 输出）。超了要么截断，要么报错。"}, {"t": "用量字段", "en": "usage", "d": "每次响应都带 `prompt_tokens`（输入）、`completion_tokens`（输出）、`total_tokens`。按这几个数算钱。"}], "steps": [{"text": "同一段意思，分别用中英文问一次，比较用量。", "code": "def ask(text):\n    r = client.chat.completions.create(\n        model=\"deepseek-chat\",\n        messages=[{\"role\": \"user\", \"content\": text}])\n    u = r.usage\n    return u.prompt_tokens, u.completion_tokens\n\nask(\"用一句话解释什么是折现\")\nask(\"Explain discounting in one sentence.\")", "out": "同样是 10 来个字，中文的 prompt_tokens 通常更多"}, {"text": "按单价算这笔请求花了多少钱（单位：元 / 百万 token）。", "code": "IN_PRICE, OUT_PRICE = 2.0, 8.0   # 以官网定价为准，随时会变\ncost = (pin * IN_PRICE + pout * OUT_PRICE) / 1_000_000\nprint(f\"{cost:.6f} 元\")", "out": "单次通常是 0.0000x 元，跑 1 万次才有感觉"}, {"text": "估一个真实任务：1000 条文本分类，每条 300 字输入、20 字输出。", "code": "n = 1000\npin, pout = 600, 30        # 粗估：中文一字≈1.5 token\nprint((pin*n*IN_PRICE + pout*n*OUT_PRICE) / 1_000_000, \"元\")", "out": "约 1.4 元 —— 先算钱，再决定要不要跑"}], "quiz": [{"q": "为什么中文通常比英文贵？", "a": "中文一个汉字常被切成 1–2 个 token，同样信息量下 token 数更多。"}, {"q": "上下文窗口 128k 是指什么？", "a": "输入 + 输出总共不超过 128k token；超了会被截断或直接报错。"}, {"q": "跑批任务前，第一件事该算什么？", "a": "总 token 数 × 单价。先算钱，再决定要不要跑、要不要先抽样。"}], "can": "拿到一个任务，能估算它的大致花费，而不是跑完才看账单。"}, {"id": "llm4", "title": "把文本变成可检索的向量", "min": 30, "hook": "你有 1000 条笔记，想找出「和这句话最像的 3 条」。搜关键词会漏，因为「折现」和「现值」一个字都不同。", "goals": ["理解「相似」怎么变成数字", "会用 TF-IDF 做第一版检索", "知道 RAG 的三步"], "concepts": [{"t": "向量化", "en": "vectorize", "d": "把一段文本压成一串数字。意思越近，数字越接近。"}, {"t": "余弦相似度", "en": "cosine similarity", "d": "看两个向量的夹角而不是长度。结果在 -1 到 1 之间，1 表示方向完全一致。"}, {"t": "RAG", "en": "retrieval-augmented generation", "d": "先检索出相关片段，再把片段塞进提示词让模型回答。三步：切块 → 检索 → 拼提示。"}], "steps": [{"text": "先用最土的办法：TF-IDF + 余弦，不下载任何模型。", "code": "from sklearn.feature_extraction.text import TfidfVectorizer\nfrom sklearn.metrics.pairwise import cosine_similarity\n\ndocs = [\"折现是把未来的钱换算成今天的价值\",\n        \"复利是利息也生利息\",\n        \"期权是未来买卖的权利\"]\nv = TfidfVectorizer().fit_transform(docs + [\"现值怎么算\"])\nsim = cosine_similarity(v[-1], v[:-1])\nprint(sim, docs[sim.argmax()])", "out": "第一条最像 —— 它认出了「现值/折现」的字面接近"}, {"text": "看它的局限：换一批词完全不同的同义句。", "code": "docs2 = [\"discount future cash flows\", \"compound interest\"]\nv2 = TfidfVectorizer().fit_transform(docs2 + [\"现值怎么算\"])\ncosine_similarity(v2[-1], v2[:-1])", "out": "相似度接近 0 —— 字面匹配到此为止"}, {"text": "工业界的做法：把 TF-IDF 换成 embedding 模型，其余流程一模一样。", "code": "# 换成 embedding 后，只需替换这一行：\n# vec = embed(text)\n# 余弦、top-k、拼提示 全都不变", "out": "流程不变，只换「把文本变数字」的那一步"}], "quiz": [{"q": "为什么用余弦而不用欧氏距离？", "a": "余弦只看方向，不受文本长短影响；长文档和短句也能公平比较。"}, {"q": "TF-IDF 在什么情况下会失效？", "a": "同义不同词、跨语言、缩写和全称——它只认字面。"}, {"q": "RAG 的三步是什么？为什么要有第一步「切块」？", "a": "切块、检索、拼提示。整篇文档太长塞不进上下文，切成小段才能只把相关的几段放进去。"}], "can": "给自己的一批笔记做一个「输入一句话、返回最像的 3 条」的小工具。"}, {"id": "llm5", "title": "让它稳定输出 JSON", "min": 30, "hook": "你让模型输出结构化数据，它有时带解释、有时用单引号、有时干脆多说一句「好的」——你的程序当场崩。", "goals": ["会用 JSON 模式约束输出", "会写「解析失败就重试」的保护", "会用 20 条测试集算通过率"], "concepts": [{"t": "JSON 模式", "en": "response_format", "d": "请求里声明 `{\"type\": \"json_object\"}`，模型会保证输出是合法 JSON。但字段结构还得靠提示词说清。"}, {"t": "重试", "en": "retry", "d": "解析失败时把错误信息塞回去再问一次，通常第二次就对了。最多重试 2 次。"}, {"t": "通过率", "en": "pass rate", "d": "拿 20 条人工标好的样本跑一遍，算「格式对且内容对」的比例。这是你唯一能拿来说服别人的数字。"}], "steps": [{"text": "先写清字段，再开 JSON 模式。", "code": "prompt = \"\"\"从下面这句话里抽取信息，输出 JSON：\n{\"company\": \"公司名\", \"amount\": 数字或 null, \"date\": \"YYYY-MM-DD 或 null\"}\n句子：{\"我们在 2024 年 3 月向某某公司投资了 5000 万元\"}\"\"\"\nr = client.chat.completions.create(\n    model=\"deepseek-chat\",\n    messages=[{\"role\": \"user\", \"content\": prompt}],\n    response_format={\"type\": \"json_object\"},\n)\nprint(r.choices[0].message.content)", "out": "{\"company\": \"某某公司\", \"amount\": 50000000, \"date\": \"2024-03-01\"}"}, {"text": "加保护：解析失败就重试，两次还不行就记失败。", "code": "import json\n\ndef extract(text, tries=2):\n    for _ in range(tries):\n        r = client.chat.completions.create(\n            model=\"deepseek-chat\",\n            messages=[{\"role\": \"user\", \"content\": prompt.replace(\"{句子}\", text)}],\n            response_format={\"type\": \"json_object\"})\n        try:\n            return json.loads(r.choices[0].message.content)\n        except json.JSONDecodeError:\n            continue\n    return None", "out": "None 表示这条失败，交给人工"}, {"text": "用 20 条样本算通过率——这是最容易被忽略、也最能说明问题的一步。", "code": "ok = sum(1 for s in samples if extract(s) is not None)\nprint(f\"{ok}/{len(samples)} = {ok/len(samples):.0%}\")", "out": "例如 17/20 = 85%，剩下的 3 条要人工或改提示"}], "quiz": [{"q": "开了 JSON 模式，为什么还需要重试？", "a": "它保证「是合法 JSON」，不保证「字段齐全、类型对」；模型仍可能漏字段或给字符串 \"null\"。"}, {"q": "怎么提高结构化抽取的通过率？", "a": "给 1–2 个完整示例（few-shot）、把字段类型写死、把长文本拆短、对失败样本单独改提示。"}, {"q": "为什么一定要有 20 条以上的人工标注样本？", "a": "没有基准就只能凭感觉说「效果不错」，出了问题也说不清是哪一类。"}], "can": "把一段非结构化文本稳定地变成程序能用的字段，并给出一个可信的通过率。"}]}, {"id": "l2s", "name": "第 2 阶段 · 会算账、会部署", "hint": "推理为什么慢、显存怎么算、本地怎么跑起来", "lessons": [{"id": "llm6", "title": "推理为什么慢", "min": 25, "hook": "同一个问题，有人等 0.5 秒看到第一个字，有人等 8 秒才出字。差别不在模型大小，在「两段式推理」。", "goals": ["分清 prefill 和 decode", "会测首个 token 时间与总时间", "知道 KV cache 是什么、为什么吃显存"], "concepts": [{"t": "预填充", "en": "prefill", "d": "把整段输入一次性算完。输入越长越慢，但能并行，吃的是算力。"}, {"t": "解码", "en": "decode", "d": "一个词一个词往外吐，每吐一个都要把前面所有 token 重新过一遍注意力。吃的是显存带宽。"}, {"t": "KV cache", "en": "KV cache", "d": "把算过的键值对存下来，避免重复计算。代价是显存：序列越长占得越多。"}], "steps": [{"text": "用流式输出，测「多久看到第一个字」和「总共多久」。", "code": "import time\n\nt0 = time.time(); first = None; text = \"\"\nfor chunk in client.chat.completions.create(\n        model=\"deepseek-chat\",\n        messages=[{\"role\": \"user\", \"content\": \"写一段 200 字的产品介绍\"}],\n        stream=True):\n    delta = chunk.choices[0].delta.content or \"\"\n    if delta and first is None:\n        first = time.time() - t0\n    text += delta\nprint(f\"首字 {first:.2f}s，总 {time.time()-t0:.2f}s，{len(text)} 字\")", "out": "首字通常 0.3–1s，总时间随字数线性增长"}, {"text": "换个长输入（比如 3000 字文档），看首字时间怎么变。", "code": "long_doc = \"...\" * 1000\n# 只问「这段讲了什么」，输入很长、输出很短\nt0 = time.time()\nclient.chat.completions.create(model=\"deepseek-chat\",\n    messages=[{\"role\": \"user\", \"content\": long_doc + \"\\n用一句话总结\"}])\nprint(time.time()-t0)", "out": "输入越长，首字越慢——这是 prefill 在变长"}, {"text": "记住一个判据：首字慢 = 输入太长；出字慢 = 输出太长。", "code": "# 优化方向完全不同：\n# 首字慢 → 截断/检索/缓存输入\n# 出字慢 → 减少输出、换更快的模型、流式展示", "out": ""}], "quiz": [{"q": "用户抱怨「很慢」，你该先问什么？", "a": "是等第一个字慢，还是字一个一个字出得慢。前者是 prefill，后者是 decode。"}, {"q": "为什么 decode 阶段 GPU 用不满？", "a": "每一步只算一个 token，矩阵太小，算力闲着，瓶颈在显存带宽。"}, {"q": "KV cache 为什么能加速？代价是什么？", "a": "省掉重复计算历史 token 的功夫；代价是显存，且随序列长度和并发数线性增长。"}], "can": "拿到一个「慢」的反馈，能判断是 prefill 还是 decode，并说清优化方向。"}, {"id": "llm7", "title": "用纸笔算清显存", "min": 25, "hook": "「我这 8GB 显存能跑 7B 吗？」——先别下载，三分钟就能算出来，省下两小时。", "goals": ["会算权重显存", "会估 KV cache", "能判断一张卡跑不跑得动"], "concepts": [{"t": "权重显存", "en": "weights", "d": "参数量 × 每参数字节数。7B 模型用 FP16 是 14GB，用 4 位量化约 3.5–4GB。"}, {"t": "量化", "en": "quantization", "d": "用更少的位存同一个参数。8 位省一半，4 位省四分之三，代价是精度略降。"}, {"t": "KV cache 显存", "en": "KV cache size", "d": "约 2 × 层数 × 头数 × 维度 × 序列长 × 并发数 × 精度。长对话、高并发时它会超过权重。"}], "steps": [{"text": "先算权重，三种精度对比。", "code": "params = 7e9\nfor name, bytes_per in [(\"FP16\", 2), (\"INT8\", 1), (\"Q4\", 0.5)]:\n    print(f\"{name}: {params * bytes_per / 1e9:.1f} GB\")", "out": "FP16 14.0 GB / INT8 7.0 GB / Q4 3.5 GB"}, {"text": "再算 KV cache：模型参数从官方配置里查（这里用典型值）。", "code": "layers, heads, dim, seq, batch, bytes_per = 32, 8, 128, 4096, 1, 2\nkv = 2 * layers * heads * dim * seq * batch * bytes_per / 1e9\nprint(f\"KV cache ≈ {kv:.2f} GB\")", "out": "约 0.54 GB（单条 4k 对话）；32 并发就是 17 GB"}, {"text": "加起来判断：8GB 卡能跑什么。", "code": "print(3.5 + 0.54)   # Q4 + 单条 4k：约 4 GB → 能跑，还剩 4GB 给批处理和开销\nprint(14 + 0.54)    # FP16：14.5 GB → 跑不动", "out": "结论：8GB 只能跑 4 位量化的 7B，且并发不能高"}], "quiz": [{"q": "同样是 7B，为什么 Q4 只要 3.5GB？", "a": "每个参数从 2 字节压到 0.5 字节（4 位），显存降为 1/4，代价是少量精度损失。"}, {"q": "为什么长对话越来越吃显存？", "a": "KV cache 随序列长度线性增长；聊到 32k 时，光是缓存就能超过模型权重。"}, {"q": "8GB 卡想提高并发，优先做什么？", "a": "降 KV cache：更短的上下文、更少的并发、GQA 类结构、或把一部分层放 CPU。"}], "can": "在下载任何模型之前，用两行算术判断它能不能跑、能跑几个并发。"}, {"id": "llm8", "title": "本地跑起来并压测", "min": 30, "hook": "模型文件 4GB，双击打不开。你需要一个「推理引擎」，就像视频文件需要播放器。", "goals": ["在本机跑起一个 7B 模型", "会测吞吐和延迟", "理解批处理带来的取舍"], "concepts": [{"t": "推理引擎", "en": "inference engine", "d": "把权重变成能服务的程序：llama.cpp（轻、跨平台）、Ollama（更好装）、vLLM（吞吐最高，但要 Linux）。"}, {"t": "吞吐 vs 延迟", "en": "throughput vs latency", "d": "一次服务更多人（吞吐高）往往让每个人等更久（延迟高）。这两个指标永远要一起看。"}, {"t": "并发", "en": "concurrency", "d": "同时处理的请求数。批处理能提高吞吐，但会拉长单请求完成时间。"}], "steps": [{"text": "装 Ollama，一条命令拉一个 4 位量化的 7B。", "code": "winget install Ollama.Ollama\nollama run qwen2.5:7b-instruct-q4_K_M", "out": "进入对话界面，能回答就说明跑通了"}, {"text": "用 HTTP 接口测单次延迟（Ollama 默认监听 11434）。", "code": "import time, requests\n\nt0 = time.time()\nr = requests.post(\"http://localhost:11434/api/generate\", json={\n    \"model\": \"qwen2.5:7b-instruct-q4_K_M\", \"prompt\": \"用一句话解释复利\", \"stream\": False})\nprint(f\"{time.time()-t0:.2f}s\", r.json()[\"response\"][:30])", "out": "首字不含流式，这里测的是总耗时"}, {"text": "发 20 个并发请求，算每秒完成数（吞吐）。", "code": "from concurrent.futures import ThreadPoolExecutor\nimport time, requests\n\ndef one(_):\n    return requests.post(\"http://localhost:11434/api/generate\", json={\n        \"model\": \"qwen2.5:7b-instruct-q4_K_M\", \"prompt\": \"说一句短话\", \"stream\": False}).status_code\n\nt0 = time.time()\nwith ThreadPoolExecutor(max_workers=8) as ex:\n    list(ex.map(one, range(20)))\ndt = time.time() - t0\nprint(f\"20 个请求 {dt:.1f}s，吞吐 {20/dt:.2f} req/s\")", "out": "例如 20 个请求 40s → 0.5 req/s；调小 max_workers 通常更快"}], "quiz": [{"q": "为什么并发开到 8 反而可能更慢？", "a": "8GB 显存放不下 8 份 KV cache，会退化成串行或爆显存；并发要按显存算，不是越大越好。"}, {"q": "Ollama 和 vLLM 该怎么选？", "a": "单机试用、Windows、图省事用 Ollama；生产要吞吐、要批处理调度用 vLLM（Linux）。"}, {"q": "「模型能跑」和「服务能用」差在哪？", "a": "能跑只看单次；能用要看并发下的吞吐、超时、显存稳定性和降级策略。"}], "can": "在 8GB 笔记本上跑起 7B 模型，并给出它的吞吐和延迟数字（而不是「感觉还挺快」）。"}]}], "intro": {"why": "把大模型从「在网页上聊天」，变成「接进你自己程序里、能部署、能算账」。", "do": ["用 API 做出自己的小工具：抽取字段、分类、问答", "在一个需求开始前，算清它要花多少钱、要什么卡", "在本机跑起 7B，并给出吞吐和延迟的数字"], "who": "想转 AI 工程 / 想给产品加 AI 能力 / 不需要数学背景", "need": "完全零基础可以：前 3 关从装 Python 开始；一个 DeepSeek key；后 4 关需要 8GB 显卡", "time": "11 关 + 3 关起步，约 6.5 小时；每天一关，三周", "not": "不训练模型、不推公式、不做微调", "first": "只想看一句话结论：这条线教的是「怎么把模型用起来」，不是「怎么造模型」。", "next": ["学完这条线 → 直接进入「LLM 工程线」（eng1–eng6）：评估、RAG、结构化输出、安全", "那 6 关解决的是「演示能跑、上线就崩」，是你这条线之后最该补的一层", "再往后：微调（LoRA）、Agent 与工具调用、多模型路由"]}}, {"id": "quant", "name": "量化线", "sub": "10 关 · 算账 → 判断 → 回测 → 定价 → 决策", "stages": [{"id": "s1", "name": "阶段 1 · 会算账", "hint": "先让电脑替你算，别急着学金融", "lessons": [{"id": "start", "title": "从打开终端开始", "min": 20, "hook": "双击一个文件，它就打开了——但写程序不是双击。你要先学会「在终端里命令电脑做事」，这一步过了，后面才谈得上代码。", "goals": ["打开终端，知道它和鼠标点击的区别", "装好 Python 并跑通第一行输出", "读懂最常见的三种报错，不再一报错就慌", "分清 shell 和 Python 解释器：知道代码该交给谁执行"], "concepts": [{"t": "终端", "en": "terminal", "d": "一个只能打字、不能点的窗口。你输入命令，电脑执行并把结果打在下面。Windows 上叫「命令提示符」或「PowerShell」。"}, {"t": "解释器", "en": "interpreter", "d": "一个能把你的 .py 文件翻译成电脑动作的程序。装了 Python，就等于装了这个解释器。"}, {"t": "报错", "en": "traceback", "d": "程序出错时打印的说明。最后一行是错误类型，往上找第一处「你自己写的文件名」，就是出事的地方。"}], "steps": [{"text": "按 Win 键，输入 powershell，回车。出现一个可以打字的窗口，光标在闪，就对了。", "code": "powershell", "out": "一个没有按钮、只有文字的窗口"}, {"text": "确认电脑里有没有 Python。没有就用下面第一行装（需要联网几分钟）。", "code": "python --version\n# 若提示找不到命令：\nwinget install -e --id Python.Python.3.12", "out": "Python 3.12.x"}, {"text": "新建一个文件 hello.py（记事本另存为，注意后缀是 .py），写一行，然后在终端里运行它。", "code": "print(\"你好\")\n\n# 终端里，先 cd 到文件所在目录，再：\npython hello.py", "out": "你好"}, {"text": "第一个坑：不要在 PowerShell 里直接敲 Python 代码。PowerShell 自己有个 print 命令（意思是「发给打印机」），所以会报「无法初始化设备 PRN」——这不是 Python 的错，是你在错误的窗口里说话。", "code": "print(\"你好\")\n# PowerShell 里的结果：\n# 无法初始化设备 PRN\n\n# 正确做法一：先进入解释器\npython\n>>> print(\"你好\")\n>>> exit()\n\n# 正确做法二：写进 .py 文件再运行\npython hello.py", "out": "你好"}, {"text": "故意写错一次，看报错长什么样——这比跑对更重要。", "code": "print(nihao)", "out": "NameError: name 'nihao' is not defined —— 意思是「没定义过这个名字」"}], "quiz": [{"q": "为什么不能双击 .py 文件来运行？", "a": "双击只是打开编辑器；要让它执行，得用解释器运行（python 文件名）。终端就是你和解释器之间的入口。"}, {"q": "SyntaxError 和 NameError 有什么区别？", "a": "SyntaxError = 语法写错了（少括号、少引号），程序根本没开始跑；NameError = 语法没问题，但你用了一个没定义的名字。"}, {"q": "报错信息那么长，先看哪一行？", "a": "先看最后一行（错误类型和原因），再往上找第一个出现你自己文件名的行号。"}, {"q": "在 PowerShell 里直接敲 print(\"你好\")，为什么报的是「无法初始化设备 PRN」？", "a": "因为 PowerShell 把 print 当成了自己的别名（Out-Printer，发给打印机），代码根本没交给 Python。要么先用 python 进入解释器（>>> 提示符），要么写进 .py 文件用 python 文件名运行。"}], "can": "在终端里跑通自己的第一个程序，遇到报错能说出是哪一类。"}, {"id": "vars", "title": "变量与运算：让电脑替你算数", "min": 20, "hook": "你心算 100 块按 5% 涨一年是多少，大概要三秒；电脑要你先告诉它「100 是多少」，然后它一毫秒给你答案，而且永远不错。", "goals": ["会定义变量、做加减乘除", "知道整数和小数的区别、为什么金额别用小数类型", "会拼接文字和数字"], "concepts": [{"t": "变量", "en": "variable", "d": "贴了名字的盒子。`x = 100` 就是把 100 放进叫 x 的盒子；以后写 x，电脑就去盒子里取。"}, {"t": "运算", "en": "operators", "d": "`+ - * /` 是四则；`*` 是乘不是 x；`**` 是乘方（`1.05 ** 20` 就是 1.05 的 20 次方）。"}, {"t": "字符串", "en": "string", "d": "引号里的文字，比如 `\"你好\"`。它和数字不能直接相加，要先把数字转成文字。"}], "steps": [{"text": "先验证一件事：电脑按数学顺序算，不是从左往右。", "code": "print(2 + 3 * 4)      # 14\nprint((2 + 3) * 4)    # 20", "out": "14 / 20 —— 括号决定谁先算"}, {"text": "用变量算一次复利，改数字再跑一次。", "code": "x = 100\nx = x * 1.05\nprint(x)              # 105.0\n\nx = x * 1.05\nprint(x)              # 110.25", "out": "105.0 / 110.25 —— 第二年的利息是「利息也生息」"}, {"text": "把文字和数字拼在一起，做成一句人话。", "code": "money = 100 * 1.05 ** 20\nprint(\"20 年后：\" + str(round(money, 2)) + \" 元\")", "out": "20 年后：265.33 元 —— 数字要先 str() 才能和文字相加"}], "quiz": [{"q": "`2 + 3 * 4` 为什么不是 20？", "a": "乘除先于加减，等价于 2 + 12 = 14。想先加就写括号。"}, {"q": "`x = x * 1.05` 这一句在干嘛？", "a": "先算右边（旧 x 乘 1.05），再把结果放回 x。变量可以被覆盖，旧值就没了。"}, {"q": "`\"100\"` 和 `100` 有什么区别？", "a": "前者是文字（不能做数学），后者是数字。混用会报 TypeError。"}], "can": "用变量和一行算式，算出任意本金、任意年数下的复利结果。"}, {"id": "control", "title": "条件与重复：让电脑做判断", "min": 20, "hook": "「涨了就买、跌了就卖」——这句话电脑听不懂，除非你把它翻成「如果…就…」。同理，连续 20 年复利，你不该手写 20 行。", "goals": ["会写 if / else 做判断", "会用 for 重复做同一件事", "知道缩进在 Python 里是语法，不是排版"], "concepts": [{"t": "布尔", "en": "bool", "d": "只有两个值：True 和 False。比较的结果就是它：`3 > 2` 得到 True。"}, {"t": "条件", "en": "if / else", "d": "如果条件成立就做 A，否则做 B。`=` 是赋值，`==` 才是比较，写错会静默出错。"}, {"t": "循环", "en": "for", "d": "把同一段代码重复 N 次。`range(3)` 给的是 0、1、2 三个数（从 0 开始）。"}], "steps": [{"text": "先用比较得到 True/False，再用 if 决定做什么。", "code": "r = 0.05\nif r > 0:\n    print(\"上涨\")\nelse:\n    print(\"下跌或持平\")", "out": "上涨 —— 注意缩进 4 个空格，Python 靠它判断层级"}, {"text": "重复 3 次，看看 range 给的到底是什么。", "code": "for i in range(3):\n    print(i)", "out": "0 / 1 / 2 —— 不含 3"}, {"text": "把复利写进循环：想算 50 年，只改一个数字。", "code": "money = 100\nfor year in range(20):\n    money = money * 1.05\nprint(money)", "out": "265.33 —— 想算 50 年就把 20 改成 50"}], "quiz": [{"q": "`range(3)` 会跑几次？分别是几？", "a": "3 次，i 分别是 0、1、2。要 1 到 3 得写 range(1, 4)。"}, {"q": "`=` 和 `==` 有什么区别？", "a": "`=` 是把右边装进左边；`==` 是问「两边相等吗」，返回 True/False。"}, {"q": "为什么 if 下面的代码要缩进？", "a": "Python 用缩进表示「哪些行属于这个 if」。不缩进就跑到 if 外面去了。"}], "can": "把一句自然语言的规则（涨了买、跌了卖）翻成 if/else，并用循环批量算多年。"}, {"id": "l1", "title": "让电脑替你算钱", "min": 20, "hook": "你有 10 万块，年化 5%，放 20 年是多少？手算会错，Excel 会忘公式，写三行代码一辈子都能重算。", "goals": ["会定义变量、写循环、调用函数", "看懂复利和单利的区别", "能改参数重算任意情景"], "concepts": [{"t": "变量", "en": "variable", "d": "一个贴了名字的盒子，里面放一个值。`money = 100000` 就是把 10 万放进叫 money 的盒子。"}, {"t": "循环", "en": "for loop", "d": "把同一件事重复做 N 次。复利就是「每年乘一次 1.05」，重复 20 次。"}, {"t": "函数", "en": "function", "d": "把一段计算打包成名字，以后换参数直接喊名字，不用重抄。"}], "steps": [{"text": "打开 Jupyter（或任何 Python 环境），敲下面三行。", "code": "money = 100000\nfor year in range(20):\n    money = money * 1.05\nprint(money)", "out": "265329.77…"}, {"text": "用公式验证同一个结果，确认你没算错。", "code": "100000 * 1.05 ** 20", "out": "265329.77…（和上面一致）"}, {"text": "把「每年乘一次」写成一个函数，以后换本金、换利率都能用。", "code": "def compound(principal, rate, years):\n    for _ in range(years):\n        principal = principal * (1 + rate)\n    return principal\n\ncompound(100000, 0.08, 30)", "out": "约 100 万"}], "quiz": [{"q": "`1.05` 这个数字代表什么？如果年化 8%，该改成多少？", "a": "代表「本金 + 5% 的利息」。年化 8% 就改成 1.08。"}, {"q": "为什么不能用 `100000 * (1 + 0.05 * 20)`？算出来差多少？", "a": "那是单利（每年只对本金计息），结果是 20 万；复利把利息也拿去生息，是 26.5 万，差 6.5 万。"}, {"q": "如果要算「每月复利」，循环里应该乘什么？", "a": "乘 `1 + 0.05/12`，并且循环 240 次（20 × 12）。"}], "can": "给别人算「这笔钱放 N 年变多少」，并说清复利和单利的差别。"}, {"id": "l2", "title": "把一年的行情装进表格", "min": 25, "hook": "交易所给你一个 CSV：日期、开盘、收盘、成交量。你想知道「哪三个月跌得最惨」，用眼睛翻 250 行是不现实的。", "goals": ["会把 CSV 读成 DataFrame", "会用日期做索引、筛选、分组", "会算每日收益率"], "concepts": [{"t": "DataFrame", "en": "DataFrame", "d": "有行名有列名的表格。行名常是日期，列是开盘/收盘这些字段。"}, {"t": "索引", "en": "index", "d": "行的名字。把日期设为索引后，`df.loc['2020-03']` 就能取出那个月。"}, {"t": "收益率", "en": "return", "d": "今天比昨天涨跌的百分比，`pct_change()` 一行算完。价格本身不能直接比，收益率才能。"}], "steps": [{"text": "读入文件，把日期列变成索引（这一步不做，后面按时间筛选全废）。", "code": "import pandas as pd\n\ndf = pd.read_csv(\"prices.csv\", parse_dates=[\"date\"], index_col=\"date\")\ndf.head()", "out": "前 5 行，索引是日期"}, {"text": "算每日收益率。注意第一行一定是 NaN——因为第一天没有「昨天」。", "code": "df[\"ret\"] = df[\"close\"].pct_change()\ndf[[\"close\", \"ret\"]].head()", "out": "ret 第一行 NaN，第二行是百分比"}, {"text": "按月加总，再从小到大排，最差的那几个月就在最上面。", "code": "monthly = df[\"ret\"].resample(\"ME\").sum()\nmonthly.sort_values().head(3)", "out": "三个负得最多的月份"}], "quiz": [{"q": "为什么 `pct_change()` 的第一行是 NaN？该删掉还是保留？", "a": "第一天没有前一天可比。算指标时删掉（dropna），但要先算完再删，否则会少一天。"}, {"q": "`resample(\"ME\")` 里的 ME 是什么意思？", "a": "Month End，按月分组并取月末。想按周就写 `\"W\"`。"}, {"q": "如果数据不是按日期排序的，`pct_change()` 会怎样？", "a": "会算错——它按行顺序相减。读入后先 `df.sort_index()`。"}], "can": "拿到任何一份行情 CSV，五分钟内算出月度收益并找出最差的几个月。"}, {"id": "l3", "title": "第一张图：看见波动", "min": 25, "hook": "只看数字，2008 年和 2017 年都是「有涨有跌」。画出来你才看得见：一个是悬崖，一个是楼梯。", "goals": ["会画净值曲线和收益分布", "理解波动率怎么年化", "会用最大回撤描述「最惨的时候」"], "concepts": [{"t": "累计净值", "en": "equity curve", "d": "1 块钱投进去，今天变成多少。`(1 + ret).cumprod()` 一行算完。"}, {"t": "波动率", "en": "volatility", "d": "收益的上下抖动幅度。日波动乘 √252 就是年化，因为一年约 252 个交易日。"}, {"t": "最大回撤", "en": "max drawdown", "d": "从最高点跌到最低点的幅度。它决定你「扛不扛得住」。"}], "steps": [{"text": "画净值曲线：两条线就够了，横轴日期、纵轴净值。", "code": "import matplotlib.pyplot as plt\n\nequity = (1 + df[\"ret\"].fillna(0)).cumprod()\nplt.plot(equity.index, equity)\nplt.title(\"1 元钱的去向\")\nplt.show()", "out": "一条从左下往右上（或右下）的曲线"}, {"text": "把每日收益画成直方图，看它是不是「中间高两边低」。", "code": "plt.hist(df[\"ret\"].dropna(), bins=100)\nplt.title(\"每日收益率分布\")\nplt.show()", "out": "一个尖峰 + 两侧长尾"}, {"text": "算年化波动率和最大回撤。", "code": "vol = df[\"ret\"].std() * (252 ** 0.5)\ndd = (equity / equity.cummax() - 1).min()\nprint(f\"年化波动 {vol:.1%}，最大回撤 {dd:.1%}\")", "out": "例如：年化波动 23.8%，最大回撤 -34.2%"}], "quiz": [{"q": "年化波动 20% 大概是什么感觉？", "a": "一年里大多数时间在 ±20% 内晃；遇到坏年份跌 30% 以上很正常。"}, {"q": "回撤 -50% 之后，要涨多少才回本？", "a": "要涨 100%。这就是为什么回撤比收益更影响你能不能坚持。"}, {"q": "为什么波动率要乘 √252，而不是 ×252？", "a": "方差可加、标准差不可加。日方差乘 252 再开根，才是年化波动。"}], "can": "用三张图（净值、分布、回撤）向别人说明一个策略「赚得稳不稳」。"}]}, {"id": "s2", "name": "阶段 2 · 会判断", "hint": "数字会骗人，先学会不被骗", "lessons": [{"id": "l4", "title": "平均数会骗人", "min": 25, "hook": "两个策略年化都是 10%。一个每天小涨小跌，一个时不时腰斩再翻倍。只看年化，你会选错。", "goals": ["会算夏普比率", "理解肥尾为什么让正态假设失效", "知道样本太短时结论不可信"], "concepts": [{"t": "夏普比率", "en": "Sharpe ratio", "d": "每承担 1 单位波动赚多少超额收益。年化 1 已经不错，2 以上极其罕见。"}, {"t": "肥尾", "en": "fat tail", "d": "极端事件比正态分布预测的更常发生。1987、2008、2020 都是「几百年一遇」在同代人里发生。"}, {"t": "样本量", "en": "sample size", "d": "只回测 6 个月，夏普 3 也可能只是运气。至少 3–5 年、跨过一轮牛熊。"}], "steps": [{"text": "把夏普算出来，和年化收益放一起看。", "code": "r = df[\"ret\"].dropna()\nsharpe = r.mean() / r.std() * (252 ** 0.5)\nprint(f\"年化 {r.mean()*252:.1%}，夏普 {sharpe:.2f}\")", "out": "例如：年化 8.4%，夏普 0.35"}, {"text": "看尾部：有没有单日跌幅超过 5 个标准差的？", "code": "z = (r - r.mean()) / r.std()\n(z < -5).sum()", "out": "若大于 0，说明正态假设不成立"}, {"text": "再做一件事：按年拆开，看收益是不是集中在某一年。", "code": "yearly = (1 + r).groupby(r.index.year).prod() - 1\nyearly.sort_values(ascending=False).head(3)", "out": "如果第一名远高于其他年份，说明策略的好看全靠那一年——样本外大概率复制不出来"}], "quiz": [{"q": "夏普 1 意味着什么？", "a": "每承担 1 单位波动（约 1 个年化标准差），赚到 1 单位超额收益。"}, {"q": "为什么说「回测只有半年」的夏普没有意义？", "a": "半年约 125 个样本，噪声极大；牛市中几乎任何策略夏普都好看。"}, {"q": "两个策略夏普相同，怎么选？", "a": "看回撤、看换手率（成本）、看收益是否集中在少数几天。"}], "can": "拿到一份回测，先问三个问题：多长、扣费没、收益集中在哪几天。"}, {"id": "l5", "title": "用历史赌明天", "min": 30, "hook": "你有个想法：「连涨三天就买」。怎么用数据判断它行不行，而不是靠感觉？", "goals": ["会把想法变成特征和标签", "会正确切分训练/测试", "能识别过拟合"], "concepts": [{"t": "特征与标签", "en": "features / labels", "d": "特征是输入（过去三天涨跌、波动率），标签是要预测的答案（明天涨还是跌）。"}, {"t": "训练/测试切分", "en": "train-test split", "d": "前面 70% 学习、后面 30% 考试。时间序列必须按时间切，不能随机打乱。"}, {"t": "过拟合", "en": "overfitting", "d": "训练集很准、测试集很差。训练 0.92、测试 0.51，那 0.41 的落差就是证据。"}], "steps": [{"text": "造特征和标签。注意 `shift(-1)` 把「明天」挪到今天这一行。", "code": "df[\"f1\"] = df[\"ret\"].shift(1)\ndf[\"f2\"] = df[\"ret\"].rolling(3).mean()\ndf[\"y\"] = (df[\"ret\"].shift(-1) > 0).astype(int)\nd = df.dropna()", "out": "每行都有特征和「明天涨不涨」"}, {"text": "按时间切分，前 70% 训练。", "code": "cut = int(len(d) * 0.7)\ntrain, test = d.iloc[:cut], d.iloc[cut:]\nX, y = [\"f1\", \"f2\"], \"y\"", "out": "训练集在前，测试集在后"}, {"text": "训练一个最简单的模型，比较两边准确率。", "code": "from sklearn.linear_model import LogisticRegression\nm = LogisticRegression().fit(train[X], train[y])\nprint(m.score(train[X], train[y]), m.score(test[X], test[y]))", "out": "常见结果：0.53 / 0.49 —— 和瞎猜差不多"}], "quiz": [{"q": "为什么不能 `train_test_split(shuffle=True)`？", "a": "会把未来数据混进训练集，等于用明天的报纸预测今天，指标全是假的。"}, {"q": "测试集准确率 0.49，说明什么？", "a": "模型没有预测能力。金融里这是常态，不代表你做错了。"}, {"q": "训练 0.9、测试 0.5，第一步该动什么？", "a": "先减特征、加正则，而不是换更复杂的模型。"}], "can": "把一个「感觉有效」的想法，变成可检验的假设，并诚实地承认它无效。"}, {"id": "l6", "title": "第一次回测", "min": 30, "hook": "信号有了，钱怎么算？很多人第一步就错：用今天的信号赚今天的钱。", "goals": ["会把信号转成持仓", "会扣交易成本", "知道回测里最容易骗人的三处"], "concepts": [{"t": "信号与持仓", "en": "signal → position", "d": "信号是「想不想买」，持仓是「实际拿着多少」。今天的信号只能决定明天的仓位，所以要 `shift(1)`。"}, {"t": "交易成本", "en": "transaction cost", "d": "手续费 + 滑点。每天换手 100%，一年光成本就能吃掉几十个百分点。"}, {"t": "前视偏差", "en": "look-ahead bias", "d": "不小心用了未来才知道的信息。最常见的来源就是忘记 shift。"}], "steps": [{"text": "信号变成持仓（延迟一天），再算策略收益。", "code": "d[\"pos\"] = d[\"signal\"].shift(1).fillna(0)\nd[\"strat\"] = d[\"pos\"] * d[\"ret\"]", "out": "每行是「昨天决定、今天承担」的收益"}, {"text": "加上成本：每次换仓都要付钱。", "code": "turnover = d[\"pos\"].diff().abs().fillna(0)\ncost = turnover * 0.001          # 单边 0.1%\nd[\"net\"] = d[\"strat\"] - cost", "out": "净收益比毛收益低，换手越高差越多"}, {"text": "把扣费前后的净值画在一起。", "code": "plt.plot((1+d[\"strat\"]).cumprod(), label=\"毛\")\nplt.plot((1+d[\"net\"]).cumprod(), label=\"净\")\nplt.legend(); plt.show()", "out": "两条线越走越开 = 成本在吃你"}], "quiz": [{"q": "为什么持仓要 `shift(1)`？", "a": "今天的收盘价出来时，今天已经没法交易了。信号只能用于明天。"}, {"q": "单边 0.1% 的成本，每天换手一次，一年大概吃掉多少？", "a": "约 0.1% × 2 × 252 ≈ 50 个百分点——足以让任何高频策略归零。"}, {"q": "回测年化 180%，扣费后 35%，说明什么？", "a": "策略本身可能有微弱优势，但绝大部分收益是换手制造出来的幻觉。"}], "can": "跑出一条「扣费后的净值曲线」，并说清每一笔成本从哪来。"}]}, {"id": "s3", "name": "阶段 3 · 会定价", "hint": "价格为什么是这个数，而不是你猜的数", "lessons": [{"id": "l7", "title": "什么叫「公平的价格」", "min": 30, "hook": "一份合约：一年后股价高于 100 就付你差价，低于 100 就一分不给。你愿意今天出多少钱买它？", "goals": ["理解无套利的直觉", "会用复制组合算价格", "知道为什么价格与「你觉得会涨」无关"], "concepts": [{"t": "无套利", "en": "no-arbitrage", "d": "不存在「零成本、零风险、稳赚」的机会。同一件东西不能有两个价，否则立刻被搬平。"}, {"t": "复制组合", "en": "replication", "d": "用股票 + 存款拼出一个组合，让它在任何情况下付的钱都和合约一样。拼出来的成本，就是合约的价格。"}, {"t": "风险中性概率", "en": "risk-neutral probability", "d": "让「贴现后的价格」变成公平赌局的那组权重。它是算出来的，不是真实涨跌概率。"}], "steps": [{"text": "设一个只有两种未来的世界：涨到 120 或跌到 90，利率 5%。", "code": "S0, Su, Sd, r = 100, 120, 90, 0.05\nq = (S0 * (1 + r) - Sd) / (Su - Sd)\nq", "out": "0.5"}, {"text": "用 q 给看涨期权（行权价 100）定价。", "code": "K = 100\nCu, Cd = max(Su - K, 0), max(Sd - K, 0)\nprice = (q * Cu + (1 - q) * Cd) / (1 + r)\nprice", "out": "约 9.52"}, {"text": "换个思路验算：直接买 0.667 股 + 借钱，看成本是不是同一个数。", "code": "delta = (Cu - Cd) / (Su - Sd)\nbond = (Cd - delta * Sd) / (1 + r)\ndelta * S0 + bond", "out": "同样约 9.52 —— 两条路必须相等"}], "quiz": [{"q": "如果看涨期权市场价 7 元（低于算出来的 9.52），怎么套利？", "a": "买入期权、卖空 delta 股、把差额存银行；到期无论涨跌都锁定无风险利润。"}, {"q": "为什么价格和你「觉得会涨」无关？", "a": "因为复制组合已经锁死了现金流；你的看法影响的是期望收益，不是无套利价格。"}, {"q": "真实市场价格常常偏离 BSM，为什么？", "a": "模型假设（连续对冲、无摩擦、正态）不成立；波动率本身也在交易。"}], "can": "给一个两状态世界里的任何合约定价，并解释为什么这个价格不能被反驳。"}, {"id": "l8", "title": "用随机模拟给期权定价", "min": 30, "hook": "三条路算同一个期权：公式、二叉树、随机模拟。如果三者一致，你才算真的懂了。", "goals": ["会模拟几何布朗运动路径", "会用蒙特卡洛给欧式期权定价", "理解误差为什么按 1/√N 下降"], "concepts": [{"t": "蒙特卡洛", "en": "Monte Carlo", "d": "随机造几万条可能的未来，把每条的结果平均，就是价格。路径越复杂，公式越写不出来，越要靠它。"}, {"t": "几何布朗运动", "en": "GBM", "d": "假设价格的对数按「漂移 + 随机波动」走。写成代码就是一行指数。"}, {"t": "误差量级", "en": "standard error", "d": "精度按 1/√N 提升：想让误差减半，路径数要翻 4 倍。"}], "steps": [{"text": "模拟 10 万条一年后的价格。", "code": "import numpy as np\nS0, r, sigma, T, N = 100, 0.03, 0.2, 1.0, 100000\nz = np.random.standard_normal(N)\nST = S0 * np.exp((r - 0.5 * sigma**2) * T + sigma * np.sqrt(T) * z)", "out": "10 万个终点价格，均值约 103"}, {"text": "给看涨期权定价，并和 BSM 公式对比。", "code": "K = 100\npayoff = np.maximum(ST - K, 0)\nprice = np.exp(-r * T) * payoff.mean()\nprint(price, payoff.std() / np.sqrt(N) * np.exp(-r * T))", "out": "约 9.4 ± 0.05"}, {"text": "把 N 从 1 万加到 100 万，看误差怎么变。", "code": "for n in [10_000, 100_000, 1_000_000]:\n    z = np.random.standard_normal(n)\n    s = S0 * np.exp((r - .5*sigma**2)*T + sigma*np.sqrt(T)*z)\n    print(n, np.exp(-r*T) * np.maximum(s-K, 0).mean())", "out": "三条结果越来越接近同一个数"}], "quiz": [{"q": "为什么公式里是 `(r - 0.5σ²)` 而不是 `r`？", "a": "这是伊藤引理的修正项：对数收益的期望是 r − σ²/2，直接用 r 会系统性偏高。"}, {"q": "模拟 1 万条路径，价格误差大概多少？", "a": "约为标准差 / √10000 = 1%。想要 0.1% 的精度，要 100 万条。"}, {"q": "什么情况下必须用蒙特卡洛，而不能用 BSM？", "a": "路径依赖（障碍、雪球）、多资产、美式提前行权——没有闭式解的时候。"}], "can": "独立写出蒙特卡洛定价，并用 BSM 交叉验证自己的答案。"}]}, {"id": "s4", "name": "阶段 4 · 会决策", "hint": "从「预测」走到「做决定」，对应《RL for Finance》", "lessons": [{"id": "rl1", "title": "把交易变成一场游戏", "min": 25, "hook": "预测明天涨跌，和「明天买多少」，是两个问题。前者答对了也未必赚钱，后者才决定盈亏。", "goals": ["会把一个交易问题写成状态/动作/奖励", "理解奖励设计为什么最难", "跑通一个极简环境循环"], "concepts": [{"t": "状态", "en": "state", "d": "智能体看到的全部信息：当前持仓、过去几天收益、波动率。看不到的信息等于不存在。"}, {"t": "动作", "en": "action", "d": "它能做的选择：买 / 卖 / 不动，或者连续的头寸比例 0–1。"}, {"t": "奖励", "en": "reward", "d": "每步给它的分数。奖励设错了，它会精准地学会你最不想要的行为。"}], "steps": [{"text": "先写一个最小环境：只有三种状态（空仓/半仓/满仓）和两种动作。", "code": "class Env:\n    def __init__(self, rets):\n        self.rets, self.i, self.pos = rets, 0, 0\n    def reset(self):\n        self.i, self.pos = 0, 0\n        return self._obs()\n    def _obs(self):\n        return [self.pos, self.rets[self.i]]\n    def step(self, a):          # a: -1 减仓 / 0 不动 / 1 加仓\n        self.pos = max(0, min(1, self.pos + 0.5 * a))\n        r = self.pos * self.rets[self.i]     # 奖励 = 仓位 × 当日收益\n        self.i += 1\n        done = self.i >= len(self.rets) - 1\n        return self._obs(), r, done", "out": "一个 15 行的迷你环境"}, {"text": "跑一遍随机策略，看累计奖励是多少。", "code": "import numpy as np\nrets = np.random.normal(0.0003, 0.01, 250)\nenv = Env(rets); env.reset(); total = 0\nwhile True:\n    _, r, done = env.step(np.random.choice([-1, 0, 1]))\n    total += r\n    if done: break\nprint(round(total, 4))", "out": "通常接近 0 —— 随机策略不赚钱，这是基准"}, {"text": "换一个奖励：不只看收益，还罚波动（更接近真实目标）。", "code": "r = self.pos * self.rets[self.i] - 0.5 * (self.pos ** 2) * (0.01 ** 2)", "out": "同样的策略，奖励变小但更稳 —— 这就是「奖励设计」"}], "quiz": [{"q": "把「明天涨跌」当奖励会有什么问题？", "a": "它奖励的是预测正确，不是赚钱；预测对但仓位错，照样亏。"}, {"q": "为什么状态里要放持仓？", "a": "因为能否加仓取决于现在拿了多少；不给持仓，智能体会在满仓时继续买入。"}, {"q": "奖励里罚波动，相当于改变了什么？", "a": "把目标从「赚最多」改成「赚得稳」，等价于最大化风险调整后收益。"}], "can": "把一个模糊的「帮我炒得更好」，翻译成状态、动作、奖励三件套。"}, {"id": "rl2", "title": "让智能体学对冲", "min": 30, "hook": "教科书说「按 delta 对冲」，但真实市场有交易成本、有跳空。能不能让机器自己学一个「什么时候调多少」？", "goals": ["理解 DQN 的核心三件套", "会训练一个对冲智能体", "会和固定间隔对冲做对比"], "concepts": [{"t": "Q 值", "en": "Q-value", "d": "在某个状态下做某个动作，未来能拿到的总奖励的估计。学好了，选 Q 最大的动作即可。"}, {"t": "经验回放", "en": "replay buffer", "d": "把过去的状态/动作/奖励存起来，随机抽一批来训练，打破时间相关性。"}, {"t": "探索", "en": "epsilon-greedy", "d": "小概率随机试试别的动作。不探索就永远发现不了更好的策略。"}], "steps": [{"text": "把对冲写成一个环境：状态含 delta 偏离，动作是调整量。", "code": "state = [abs(delta_target - delta_now), cost_level, vol_est]\naction = 0 / 1 / 2      # 不调 / 调一半 / 调到位\nreward = -abs(hedge_error) - cost * traded", "out": "每一步都在「误差」和「成本」之间权衡"}, {"text": "训练：每回合跑 250 天，存经验、抽批次更新网络。", "code": "for ep in range(200):\n    s = env.reset()\n    while True:\n        a = eps_greedy(q_net, s, eps=0.1)\n        s2, r, done = env.step(a)\n        buf.push(s, a, r, s2, done)\n        q_net.fit(*buf.sample(64))\n        s = s2\n        if done: break", "out": "训练曲线：前 50 回合奖励上升，之后趋于平稳"}, {"text": "对比：把学到的策略和「每天调一次」放在同一条曲线上。", "code": "plt.plot(test_rl, label='RL')\nplt.plot(test_fixed, label='固定间隔')\nplt.legend()", "out": "常见结果：RL 成本更低，但误差略大 —— 这就是取舍"}], "quiz": [{"q": "为什么不直接用监督学习预测「最优调整量」？", "a": "没有标准答案——最优调整依赖未来路径；RL 通过试错和奖励来学，不需要标签。"}, {"q": "回放池太小会怎样？", "a": "样本高度相关，网络会遗忘早期经验、训练不稳定。"}, {"q": "怎么判断「学出来了」而不是「碰巧」？", "a": "换一段没参与训练的行情测试，并与固定策略比较；还要跑多个随机种子看稳定性。"}], "can": "训练一个对冲智能体，并用样本外数据证明它比固定间隔策略好（或诚实地承认没有）。"}]}], "intro": {"why": "用数据判断一个交易想法，是真本事，还是运气和幻觉。", "do": ["拿到一份行情 CSV，十分钟内算出收益、波动、回撤", "看穿一个「回测年化 180%」的骗局，知道钱被什么吃掉了", "给一份合约定出可解释的价格，并说清它为什么是这个数"], "who": "对市场好奇 / 想自己验证策略 / 想补金融理论", "need": "完全零基础可以：前 3 关补 Python；高中数学够用", "time": "10 关 + 3 关起步，约 6 小时", "not": "不教高频交易、不教盘口和订单簿、不保证能赚钱", "first": "这条线最重要的一句：先学会分辨「假的好」，再谈找「真的好」。", "next": ["给一个策略写完整的回测报告，能说服别人也说服自己", "往下走：因子研究、组合优化、风控与归因", "再往后：把研究代码搬进 C++ 或向量化引擎，跑实盘数据"]}}, {"id": "nlp", "name": "文本线", "sub": "5 关 · 对应《Blueprints for Text Analytics》", "stages": [{"id": "n1", "name": "第 1 阶段 · 看清文本", "hint": "先知道手里有什么，再谈分析", "lessons": [{"id": "start", "title": "从打开终端开始", "min": 20, "hook": "双击一个文件，它就打开了——但写程序不是双击。你要先学会「在终端里命令电脑做事」，这一步过了，后面才谈得上代码。", "goals": ["打开终端，知道它和鼠标点击的区别", "装好 Python 并跑通第一行输出", "读懂最常见的三种报错，不再一报错就慌", "分清 shell 和 Python 解释器：知道代码该交给谁执行"], "concepts": [{"t": "终端", "en": "terminal", "d": "一个只能打字、不能点的窗口。你输入命令，电脑执行并把结果打在下面。Windows 上叫「命令提示符」或「PowerShell」。"}, {"t": "解释器", "en": "interpreter", "d": "一个能把你的 .py 文件翻译成电脑动作的程序。装了 Python，就等于装了这个解释器。"}, {"t": "报错", "en": "traceback", "d": "程序出错时打印的说明。最后一行是错误类型，往上找第一处「你自己写的文件名」，就是出事的地方。"}], "steps": [{"text": "按 Win 键，输入 powershell，回车。出现一个可以打字的窗口，光标在闪，就对了。", "code": "powershell", "out": "一个没有按钮、只有文字的窗口"}, {"text": "确认电脑里有没有 Python。没有就用下面第一行装（需要联网几分钟）。", "code": "python --version\n# 若提示找不到命令：\nwinget install -e --id Python.Python.3.12", "out": "Python 3.12.x"}, {"text": "新建一个文件 hello.py（记事本另存为，注意后缀是 .py），写一行，然后在终端里运行它。", "code": "print(\"你好\")\n\n# 终端里，先 cd 到文件所在目录，再：\npython hello.py", "out": "你好"}, {"text": "第一个坑：不要在 PowerShell 里直接敲 Python 代码。PowerShell 自己有个 print 命令（意思是「发给打印机」），所以会报「无法初始化设备 PRN」——这不是 Python 的错，是你在错误的窗口里说话。", "code": "print(\"你好\")\n# PowerShell 里的结果：\n# 无法初始化设备 PRN\n\n# 正确做法一：先进入解释器\npython\n>>> print(\"你好\")\n>>> exit()\n\n# 正确做法二：写进 .py 文件再运行\npython hello.py", "out": "你好"}, {"text": "故意写错一次，看报错长什么样——这比跑对更重要。", "code": "print(nihao)", "out": "NameError: name 'nihao' is not defined —— 意思是「没定义过这个名字」"}], "quiz": [{"q": "为什么不能双击 .py 文件来运行？", "a": "双击只是打开编辑器；要让它执行，得用解释器运行（python 文件名）。终端就是你和解释器之间的入口。"}, {"q": "SyntaxError 和 NameError 有什么区别？", "a": "SyntaxError = 语法写错了（少括号、少引号），程序根本没开始跑；NameError = 语法没问题，但你用了一个没定义的名字。"}, {"q": "报错信息那么长，先看哪一行？", "a": "先看最后一行（错误类型和原因），再往上找第一个出现你自己文件名的行号。"}, {"q": "在 PowerShell 里直接敲 print(\"你好\")，为什么报的是「无法初始化设备 PRN」？", "a": "因为 PowerShell 把 print 当成了自己的别名（Out-Printer，发给打印机），代码根本没交给 Python。要么先用 python 进入解释器（>>> 提示符），要么写进 .py 文件用 python 文件名运行。"}], "can": "在终端里跑通自己的第一个程序，遇到报错能说出是哪一类。"}, {"id": "vars", "title": "变量与运算：让电脑替你算数", "min": 20, "hook": "你心算 100 块按 5% 涨一年是多少，大概要三秒；电脑要你先告诉它「100 是多少」，然后它一毫秒给你答案，而且永远不错。", "goals": ["会定义变量、做加减乘除", "知道整数和小数的区别、为什么金额别用小数类型", "会拼接文字和数字"], "concepts": [{"t": "变量", "en": "variable", "d": "贴了名字的盒子。`x = 100` 就是把 100 放进叫 x 的盒子；以后写 x，电脑就去盒子里取。"}, {"t": "运算", "en": "operators", "d": "`+ - * /` 是四则；`*` 是乘不是 x；`**` 是乘方（`1.05 ** 20` 就是 1.05 的 20 次方）。"}, {"t": "字符串", "en": "string", "d": "引号里的文字，比如 `\"你好\"`。它和数字不能直接相加，要先把数字转成文字。"}], "steps": [{"text": "先验证一件事：电脑按数学顺序算，不是从左往右。", "code": "print(2 + 3 * 4)      # 14\nprint((2 + 3) * 4)    # 20", "out": "14 / 20 —— 括号决定谁先算"}, {"text": "用变量算一次复利，改数字再跑一次。", "code": "x = 100\nx = x * 1.05\nprint(x)              # 105.0\n\nx = x * 1.05\nprint(x)              # 110.25", "out": "105.0 / 110.25 —— 第二年的利息是「利息也生息」"}, {"text": "把文字和数字拼在一起，做成一句人话。", "code": "money = 100 * 1.05 ** 20\nprint(\"20 年后：\" + str(round(money, 2)) + \" 元\")", "out": "20 年后：265.33 元 —— 数字要先 str() 才能和文字相加"}], "quiz": [{"q": "`2 + 3 * 4` 为什么不是 20？", "a": "乘除先于加减，等价于 2 + 12 = 14。想先加就写括号。"}, {"q": "`x = x * 1.05` 这一句在干嘛？", "a": "先算右边（旧 x 乘 1.05），再把结果放回 x。变量可以被覆盖，旧值就没了。"}, {"q": "`\"100\"` 和 `100` 有什么区别？", "a": "前者是文字（不能做数学），后者是数字。混用会报 TypeError。"}], "can": "用变量和一行算式，算出任意本金、任意年数下的复利结果。"}, {"id": "control", "title": "条件与重复：让电脑做判断", "min": 20, "hook": "「涨了就买、跌了就卖」——这句话电脑听不懂，除非你把它翻成「如果…就…」。同理，连续 20 年复利，你不该手写 20 行。", "goals": ["会写 if / else 做判断", "会用 for 重复做同一件事", "知道缩进在 Python 里是语法，不是排版"], "concepts": [{"t": "布尔", "en": "bool", "d": "只有两个值：True 和 False。比较的结果就是它：`3 > 2` 得到 True。"}, {"t": "条件", "en": "if / else", "d": "如果条件成立就做 A，否则做 B。`=` 是赋值，`==` 才是比较，写错会静默出错。"}, {"t": "循环", "en": "for", "d": "把同一段代码重复 N 次。`range(3)` 给的是 0、1、2 三个数（从 0 开始）。"}], "steps": [{"text": "先用比较得到 True/False，再用 if 决定做什么。", "code": "r = 0.05\nif r > 0:\n    print(\"上涨\")\nelse:\n    print(\"下跌或持平\")", "out": "上涨 —— 注意缩进 4 个空格，Python 靠它判断层级"}, {"text": "重复 3 次，看看 range 给的到底是什么。", "code": "for i in range(3):\n    print(i)", "out": "0 / 1 / 2 —— 不含 3"}, {"text": "把复利写进循环：想算 50 年，只改一个数字。", "code": "money = 100\nfor year in range(20):\n    money = money * 1.05\nprint(money)", "out": "265.33 —— 想算 50 年就把 20 改成 50"}], "quiz": [{"q": "`range(3)` 会跑几次？分别是几？", "a": "3 次，i 分别是 0、1、2。要 1 到 3 得写 range(1, 4)。"}, {"q": "`=` 和 `==` 有什么区别？", "a": "`=` 是把右边装进左边；`==` 是问「两边相等吗」，返回 True/False。"}, {"q": "为什么 if 下面的代码要缩进？", "a": "Python 用缩进表示「哪些行属于这个 if」。不缩进就跑到 if 外面去了。"}], "can": "把一句自然语言的规则（涨了买、跌了卖）翻成 if/else，并用循环批量算多年。"}, {"id": "nlp1", "title": "一堆文本，先看清有什么", "min": 20, "hook": "运营发来一张表：两千多条工单，最长那条 800 字，最短的只有一个「好」。你第一件事不是分析，是数清它。", "goals": ["会用几行代码数清条数、空值、重复", "会看长度分布，认出异常长和异常短的文本", "会先扫一遍高频片段，再决定后面怎么切词"], "concepts": [{"t": "语料", "en": "corpus", "d": "你手里那堆待分析的文本本身。开工前先数清它有多少条、有没有空值，再谈任何结论。"}, {"t": "文档长度分布", "en": "length distribution", "d": "每条文本的字数（或词数）分布。均值会被一两条超长文本拉偏，中位数（median）更稳。"}, {"t": "词频", "en": "term frequency", "d": "某个词或片段出现的次数。排最前的常常是「的」「了」这类虚词，不是真正的主题。"}], "steps": [{"text": "先把文本装进一张表，数清三件事：多少条、多少空值、多少重复。", "code": "import pandas as pd\n\ntexts = [\n    '快递三天了还没到，能帮我查一下吗',\n    '退款申请两次了，一直没到账',\n    '包装破了，里面杯子碎了',\n    '客服电话一直打不通',\n    '好',\n    None,\n    '优惠券用不了，下单时提示已过期',\n    '物流信息三天没更新，是不是丢了',\n    '退款到账很快，谢谢',\n    '快递员没打电话就放门口了',\n    '商品和图片不一样，颜色差很多',\n    '想改收货地址，还能改吗',\n    '尺码偏小，想换大一码',\n    '发票什么时候能开',\n    None,\n    '收到货了，质量不错',\n    '客服态度很好，问题解决了',\n    'app 一直闪退，打不开',\n    '快递三天了还没到，能帮我查一下吗',\n    '退款到账很快，谢谢',\n    '下单两天了还没发货',\n    '赠品漏发了',\n    '价格比昨天贵了二十块',\n    '能不能开发票',\n    '包裹显示签收但我没收到',\n    '面膜味道有点怪',\n    '会员到期了还能续吗',\n    '售后处理太慢，等了一周',\n    '颜色比想象中好看',\n    '快递员态度很差',\n    None,\n    '保修期内坏了，怎么修',\n    '分期还款怎么还',\n    '优惠券叠加不了',\n    '东西不错，就是有点贵',\n    '换货寄回去三天了没消息',\n    'app 里找不到订单',\n    '物流一直显示已揽收',\n    '客服机器人答非所问',\n    '快递太慢了，等了一周还没到，中间问过两次客服都没解决，希望能给个说法',\n]\ndf = pd.DataFrame({'text': texts})\n\nprint(len(df), df['text'].isna().sum(), df['text'].dropna().duplicated().sum())", "out": "40 3 2 —— 40 条、3 条空、2 条完全重复。先记下来，别急着删：重复可能是同一个人投诉两次"}, {"text": "再看长度：平均值是最容易被一两条长文本带偏的那个数。", "code": "df['n'] = df['text'].str.len().fillna(0).astype(int)\nprint(df['n'].describe().round(1).to_string())\nprint('最短一条:', int(df.loc[df['text'].notna(), 'n'].min()))", "out": "count 40 / mean 9.8 / 50% 9.5 / max 34.0；最短一条: 1 —— 大多数在 8–11 字，最长那条 34 字（min 0.0 是那 3 条空值撑出来的）"}, {"text": "最后扫高频片段：没有分词工具时，先用「两个字一组」看个大概。", "code": "import re\nfrom collections import Counter\n\ngrams = Counter()\nfor t in df['text'].dropna():\n    t2 = re.sub(r'[^\\u4e00-\\u9fa5]', '', t)      # 只留汉字，去掉标点和空格\n    for i in range(len(t2) - 1):\n        grams[t2[i:i + 2]] += 1\n\nprint(grams.most_common(8))", "out": "[('快递', 5), ('三天', 4), ('天了', 4), ('了还', 4), ('还没', 4), ('没到', 4), ('一直', 4), ('客服', 4)] —— 「快递/没到/客服」是主题，「天了」「了还」是切错位置的碎片"}], "quiz": [{"q": "40 条数据里有 3 条空值、2 条重复，你会先删掉再分析吗？", "a": "先别删，先数清。空值删掉会让占比失真；重复可能是同一个人反复投诉，那本身就是信息。记下数量，再决定怎么处理。"}, {"q": "平均 9.8 字、中位数 9.5 字，两个数差不多。那什么时候必须看中位数？", "a": "有极端长句或条数少的时候。这条 34 字就把均值往上拽；分布偏斜、样本又小，中位数才代表「典型的一条」。"}, {"q": "高频第一是「快递」、第二是「三天」，第三却是「天了」。说明什么？", "a": "「天了」跨了词边界，是两字切片切出来的假词。所以这种看法只能定方向，真要统计词频得先正经分词。"}], "can": "拿到一份陌生的文本表，十分钟内就能说清它有多少条、多长、主要在讲什么。"}]}, {"id": "n2", "name": "第 2 阶段 · 把文本变成数字", "hint": "切词、加权、比相似：后面所有模型都踩在这三块砖上", "lessons": [{"id": "nlp2", "title": "清洗与分词：把句子切成词", "min": 25, "hook": "同一句 12 个词的评论，两个人切出两种结果：一个 12 个词，一个只有 4 块。后面所有统计都建在这堆「词」上。", "goals": ["会用正则洗掉网址、数字、表情和多余空格", "会把句子切成词，并对照去停用词前后的词表", "知道规则砍后缀哪里会出错，什么时候该上 spaCy"], "concepts": [{"t": "正则表达式", "en": "regex", "d": "描述「要删掉什么」的模式。`re.sub(r'http\\S+', '', t)` 一次删光所有网址。"}, {"t": "分词", "en": "tokenization", "d": "把一整句切成词的列表。英文靠空格和标点就够，中文必须先分词，否则整句算一个词。"}, {"t": "词形还原", "en": "lemmatization", "d": "把 runs、running 还原成原形 run。比 stemming（只砍后缀）准，但需要知道词性。"}], "steps": [{"text": "先洗：网址、数字、标点、表情全换成空格，大小写也统一。", "code": "import re\n\nraw = [\n    'Great battery life!!! I charge it once every 3 days 😀 http://t.cn/x1',\n    'Shipping was fast and the box arrived in perfect condition.',\n    'The screen cracked after one week, very disappointed.',\n    'Refund took 10 days and two support calls, still waiting...',\n    'Battery dies in 2 hours, useless for travel.',\n    'Love the color and the weight, feels premium.',\n    'Customer service replied within an hour, impressive.',\n    'It stopped charging after a month. Not happy at all.',\n    'Cheap price for a decent laptop, good value.',\n    'The app keeps crashing on my phone.',\n    'Arrived 4 days late, but the product is fine.',\n    'Packaging was damaged, the mug inside was broken.',\n    'Battery life is amazing, I only charge on weekends.',\n    'Worst purchase this year, returning it tomorrow.',\n    'Setup took 5 minutes, very easy.',\n    'The fan is loud and the battery drains fast.',\n    'Refunds are processed quickly, no complaints.',\n    'Screen quality is great for watching movies.',\n    'Delivery was late by a week and nobody told me.',\n    'It works as advertised, happy with the price.',\n    'Charging cable broke after two weeks.',\n    'Support sent a replacement in 2 days, great service.',\n    'The battery does not last a full day anymore.',\n    'Love it! Light, fast, and the screen is bright.',\n]\n\ndef clean(t):\n    t = t.lower()\n    t = re.sub(r'http\\S+|www\\.\\S+', ' ', t)   # 网址\n    t = re.sub(r'\\d+', ' ', t)                # 数字\n    t = re.sub(r'[^a-z\\s]', ' ', t)           # 标点、表情（中文语料改成 [^\\u4e00-\\u9fa5a-z\\s]）\n    return re.sub(r'\\s+', ' ', t).strip()\n\ncleaned = [clean(t) for t in raw]\nprint(len(cleaned), cleaned[0])", "out": "24 great battery life i charge it once every days —— 网址、数字、三个感叹号、表情全没了；'3 days' 里的 3 也没了，只剩 days"}, {"text": "切词只要一行：按空格切。先别急着去停用词，先看最常出现的是什么。", "code": "from collections import Counter\n\ntokens = [w for t in cleaned for w in t.split()]\nprint(len(tokens))\nprint(Counter(tokens).most_common(6))", "out": "192 / [('the', 12), ('and', 6), ('battery', 5), ('it', 5), ('a', 5), ('is', 5)] —— 192 个词里，前几名几乎全是虚词"}, {"text": "去停用词 + 词形还原，一起做；最后两行注释是中文语料的替换方案。", "code": "STOP = {'the', 'a', 'an', 'and', 'is', 'was', 'it', 'to', 'of', 'for', 'on',\n        'in', 'with', 'this', 'but', 'at', 'by', 'my', 'me', 'i', 'not', 'no'}\n\ndef lemma(w):\n    for suf, cut in [('ing', 3), ('ed', 2), ('es', 2), ('s', 1)]:\n        if len(w) > 4 and w.endswith(suf):\n            return w[:-cut]\n    return w\n\nkept = [lemma(w) for w in tokens if w not in STOP]\nprint(len(tokens), '->', len(kept))\nprint(Counter(kept).most_common(6))\n\n# 中文语料这一步换成（可选）：\n# python -m spacy download zh_core_web_sm\n# nlp = spacy.load('zh_core_web_sm')   # 先分词，再取 token.lemma_", "out": "192 -> 134 / [('battery', 5), ('days', 4), ('great', 3), ('fast', 3), ('screen', 3), ('after', 3)] —— 但 charge 和 charg 被砍成了两个词：规则砍后缀会过度，正式项目用 spaCy 的 lemma（`python -m spacy download en_core_web_sm`）"}], "quiz": [{"q": "把文本里所有数字都删掉，会不会删掉有用的东西？", "a": "会。「等了 10 天」「4 星」里的数字是抱怨强度和评分。更稳的做法是把数字换成 <num> 占位符，或者干脆保留。"}, {"q": "去停用词时把 not、no、never 也一起删了，会有什么后果？", "a": "情感直接反转：'not good' 变成 'good'。否定词必须留在停用词表外面，或者单独处理。"}, {"q": "为什么不能只靠砍后缀来做词形还原？", "a": "arrived 会变成 arriv，这不是一个词；charge 和 charging 还可能被砍成两半。要么查词典/词性，要么用 spaCy。"}], "can": "拿到一批原始文本，能洗成干净的词列表，并说清每一步删掉了什么、可能丢了什么。"}, {"id": "nlp3", "title": "词袋与 TF-IDF：让机器能比较两段话", "min": 25, "hook": "一条写「等了 4 天还没发货」，另一条写「4 天没发」。人一眼就知道是同一件事，机器看到的是两串完全不同的字。", "goals": ["会把 30 条评论变成一张「文档 × 词」的数字表", "能说清 IDF 在压什么词、为什么", "会用余弦相似度给一句话找出最像的评论"], "concepts": [{"t": "词袋", "en": "bag of words", "d": "只数每个词出现几次，不管顺序。一句文本变成一行数字，列是整份词表。"}, {"t": "TF-IDF", "en": "TF-IDF", "d": "词频（TF）乘逆文档频率（IDF）：词在这条里多、在别的条里少见，权重就高；'the' 到处都有，权重接近 0。"}, {"t": "余弦相似度", "en": "cosine similarity", "d": "把文本看成向量（一串数字），比两个向量的夹角。1 = 用词几乎一样，0 = 没有共同词，只比方向不比长短。"}], "steps": [{"text": "先数数：每条评论变成一行，每个词变成一列，格子里是出现次数。", "code": "import pandas as pd\nfrom sklearn.feature_extraction.text import CountVectorizer\n\ndocs = [\n    'the battery dies after two hours of use',\n    'battery life is great i charge it once a week',\n    'it stopped charging after one month',\n    'charging is slow and the battery drains fast',\n    'the charger broke after two weeks',\n    'battery drains overnight even when the phone is idle',\n    'i have to charge it twice a day now',\n    'fast charging works well and the battery lasts all day',\n    'the battery died completely and will not charge',\n    'battery is fine but the charger gets very hot',\n    'shipping took ten days and the tracking never updated',\n    'the package arrived four days late',\n    'delivery was fast and the box was in perfect condition',\n    'my package says delivered but i never received it',\n    'shipping is slow it took a week to arrive',\n    'the box arrived damaged and the screen was broken',\n    'tracking shows it is still in transit after nine days',\n    'delivered one day early and well packed',\n    'the shipping label was wrong and it went to another city',\n    'two weeks late and nobody told me why',\n    'i returned it and the refund never came',\n    'refund was processed in three days thank you',\n    'support did not answer my email for a week',\n    'i want my money back the refund is late',\n    'customer service called me back and fixed it',\n    'returned the item ten days ago still no refund',\n    'they refunded the money after two phone calls',\n    'support sends the same reply every time useless',\n    'the refund arrived quickly good service',\n    'i am still waiting for the return label',\n]\n\ncv = CountVectorizer(stop_words='english')\nX = cv.fit_transform(docs)\nprint('形状:', X.shape)\n\nnames = cv.get_feature_names_out()\nrow = X[0].toarray()[0]\nprint({names[i]: int(v) for i, v in enumerate(row) if v})", "out": "形状: (30, 84) / {'battery': 1, 'dies': 1, 'hours': 1, 'use': 1} —— 30 条 × 84 个词，第 1 条只点亮了 4 个格子，其余全是 0"}, {"text": "换成 TF-IDF：同样的表，每个格子的数字再乘一个「稀有度」。", "code": "import numpy as np\nfrom sklearn.feature_extraction.text import TfidfVectorizer\n\ntf = TfidfVectorizer(stop_words='english')\nT = tf.fit_transform(docs)\nfeat = tf.get_feature_names_out()\nidf = dict(zip(feat, tf.idf_))\ndfreq = np.asarray((T > 0).sum(axis=0)).ravel()\n\nfor w in ['battery', 'charge', 'label']:\n    print(w, int(dfreq[list(feat).index(w)]), round(float(idf[w]), 2))\n\ntf2 = TfidfVectorizer(stop_words='english', ngram_range=(1, 2))\ntf2.fit(docs)\nprint([w for w in tf2.get_feature_names_out() if ' ' in w][:5])", "out": "battery 7 2.35 / charge 3 3.05 / label 2 3.34 —— 越少见的词 IDF 越高，权重越大；最后一行是两词短语：['ago refund', 'answer email', 'arrived damaged', 'arrived days', 'arrived quickly']，有真短语也有 'ago refund' 这种碎片"}, {"text": "拿一句新评论，按同样的规则变成向量，再和 30 条逐一比夹角。", "code": "from sklearn.metrics.pairwise import cosine_similarity\n\nq = 'the delivery is late and the tracking shows nothing'\nsim = cosine_similarity(tf.transform([q]), T)[0]\n\nfor i in sim.argsort()[::-1][:3]:\n    print(round(float(sim[i]), 2), docs[i])", "out": "0.53 tracking shows it is still in transit after nine days / 0.25 delivery was fast and the box was in perfect condition / 0.23 two weeks late and nobody told me why —— 第一名对；第二三名只是共享了 delivery、late 这类词，0.2 出头基本算巧合"}], "quiz": [{"q": "两条评论用词完全一样、只是顺序相反（「发货慢但质量好」/「质量好但发货慢」），词袋能区分吗？", "a": "不能。词袋只数次数，顺序被丢掉了。要顺序就得用 n-gram（两词短语）或序列模型，代价是维度暴涨。"}, {"q": "一个词在每条评论里都出现，它的 IDF 会怎样？这对检索意味着什么？", "a": "IDF 接近 0，权重被压到几乎没用。这类词应该进停用词表，不然它们会淹没真正有区分度的词。"}, {"q": "余弦相似度 0.9，是不是说明两段话意思一样？", "a": "只能说用词高度重合。「不推荐」和「推荐」也能到 0.9，否定词、反义词它看不出来。"}], "can": "给一段新文本，能在旧文本里找出「用词最像」的几条，并说清它为什么像、什么时候会失效。"}]}, {"id": "n3", "name": "第 3 阶段 · 能判、能讲", "hint": "先拿到一个结论，再把结论翻译成人话", "lessons": [{"id": "nlp4", "title": "文本分类：把邮件分成两类", "min": 30, "hook": "一批邮件里三成是垃圾邮件。一个把全部邮件都判成「正常」的程序，准确率 70%，一封也没拦住——这和你的结果一样。", "goals": ["会用 Pipeline 把向量化和分类器串成一条线", "会读混淆矩阵，分清漏报和误报", "能解释为什么「准确率高」不等于「有用」"], "concepts": [{"t": "流水线", "en": "pipeline", "d": "把向量化和分类器打包成一个对象。fit 一次、predict 一次，训练和预测不会漏步骤。"}, {"t": "混淆矩阵", "en": "confusion matrix", "d": "2×2 的表：真正、真负、假正（正常邮件被拦）、假负（垃圾邮件被放过）。"}, {"t": "类别不平衡", "en": "class imbalance", "d": "两类样本数差很多（这里是 28 : 12）。全判成多数类也能拿高分，所以准确率不能单独看。"}], "steps": [{"text": "先分训练集和测试集，再用 Pipeline 把两步串起来训一遍。", "code": "from sklearn.pipeline import Pipeline\nfrom sklearn.feature_extraction.text import TfidfVectorizer\nfrom sklearn.linear_model import LogisticRegression\nfrom sklearn.model_selection import train_test_split\n\nemails = [\n    'can we move the review meeting to thursday afternoon',\n    'the q3 report is attached please review before friday',\n    'lunch with the client is at noon tomorrow',\n    'i will be out of office until monday',\n    'please approve the budget for the new hire',\n    'the design file is in the shared folder',\n    'thanks for joining the call yesterday',\n    'our team shipped the release on time',\n    'reminder standup at nine thirty',\n    'the invoice from the vendor needs your signature',\n    'let us discuss the roadmap next week',\n    'i updated the slides for the presentation',\n    'could you share the numbers from last month',\n    'the new hire starts on monday',\n    'we need two more days for testing',\n    'the office will be closed on friday',\n    'please add me to the mailing list',\n    'i fixed the bug in the login page',\n    'the client asked for a smaller scope',\n    'can you send the contract to legal',\n    'the conference call is rescheduled to tuesday',\n    'she will present the plan tomorrow',\n    'the vendor confirmed the delivery date',\n    'we finished the migration over the weekend',\n    'the budget spreadsheet is ready for review',\n    'his feedback was very helpful',\n    'let us book a room for the workshop',\n    'the test results look good so far',\n    'congratulations you won a lottery prize claim now',\n    'win a free iphone today click this link',\n    'limited offer buy one get one free click here',\n    'cheap loan approved in minutes apply now',\n    'urgent your account will be closed verify password',\n    'earn money fast from home no experience needed',\n    'exclusive deal ninety percent off today only',\n    'claim your free gift card now',\n    'your parcel is held pay a small fee to release it',\n    'lowest price guaranteed order now and save',\n    'final notice unpaid invoice click to avoid penalty',\n    'free trial membership cancel anytime join today',\n]\nlabels = ['ham'] * 28 + ['spam'] * 12\n\nX_tr, X_te, y_tr, y_te = train_test_split(\n    emails, labels, test_size=0.3, random_state=7, stratify=labels)\n\npipe = Pipeline([('tfidf', TfidfVectorizer(stop_words='english')),\n                 ('clf', LogisticRegression(max_iter=1000))])\npipe.fit(X_tr, y_tr)\nprint(len(y_te), round(pipe.score(X_te, y_te), 3))", "out": "12 0.667 —— 12 条测试里对了 8 条，看着还行；但先别收工"}, {"text": "看混淆矩阵：它把「对了几个」拆成「哪一类错」。", "code": "from sklearn.metrics import confusion_matrix, classification_report\n\npred = pipe.predict(X_te)\nprint(confusion_matrix(y_te, pred))\nprint(classification_report(y_te, pred, zero_division=0))", "out": "[[8 0] [4 0]] —— 8 封正常全对，4 封垃圾邮件一封都没抓到；报告里 spam 的 precision 和 recall 都是 0.00"}, {"text": "对比一下：全判「正常」的程序能拿多少分？再把类别权重调平。", "code": "import numpy as np\nfrom sklearn.pipeline import Pipeline\nfrom sklearn.feature_extraction.text import TfidfVectorizer\nfrom sklearn.linear_model import LogisticRegression\nfrom sklearn.metrics import recall_score\n\ndummy = np.array(['ham'] * len(y_te))\nprint('全判正常:', round((dummy == y_te).mean(), 3))\n\npipe2 = Pipeline([('tfidf', TfidfVectorizer(stop_words='english')),\n                  ('clf', LogisticRegression(max_iter=1000, class_weight='balanced'))])\npipe2.fit(X_tr, y_tr)\nprint('调平后:', round(pipe2.score(X_te, y_te), 3),\n      recall_score(y_te, pipe2.predict(X_te), pos_label='spam'))", "out": "全判正常: 0.667（和模型一模一样）/ 调平后: 0.917 0.75 —— 准确率只多对了 1 条，但垃圾邮件从抓到 0 封变成抓到 3 封"}], "quiz": [{"q": "一个垃圾邮件模型准确率 92%，能不能直接上线？", "a": "不能。先看混淆矩阵和召回率。92% 可能是靠多数类撑起来的，漏掉的垃圾邮件也许有一半，还得看假正会不会拦掉正常邮件。"}, {"q": "为什么测试集必须在训练之前就分出来？", "a": "先看测试集再调参数，等于提前看了答案；报出来的分数会虚高，上线就掉。"}, {"q": "假正（正常邮件被判垃圾）和假负（垃圾邮件被判正常），哪个代价高？", "a": "看业务。正常邮件被拦可能丢客户，通常更贵；所以这两类错误要分开数，而不是合并成一个准确率。"}], "can": "训练一个基线分类器，并用混淆矩阵说清它错在哪一类、错了几条。"}, {"id": "nlp5", "title": "主题模型与可解释性：这批评论在说什么", "min": 30, "hook": "3000 条评论，老板只问一句：客户主要在抱怨什么。你不可能一条条看完，也不甘心只挑自己熟悉的词。", "goals": ["会用 NMF 从一批评论里自动分出主题", "会用 coherence 比较两套主题的好坏", "能把「这条为什么归到这个主题」讲成一句人话"], "concepts": [{"t": "主题模型", "en": "topic model", "d": "假设每条文档是若干主题的混合，每个主题是一组常一起出现的词。NMF 和 LDA 是两条实现路线。"}, {"t": "主题一致性", "en": "topic coherence", "d": "一个主题里前几个词彼此有多常一起出现。分数高，说明这些词真在讲同一件事。"}, {"t": "可解释性", "en": "explainability", "d": "能指着具体的词说「因为它，所以这么判」。只给一个概率、说不出词，不算解释。"}], "steps": [{"text": "还是第 3 关那 30 条评论，这次让它自己分组。", "code": "from sklearn.feature_extraction.text import TfidfVectorizer\nfrom sklearn.decomposition import NMF\n\nreviews = [\n    'the battery dies after two hours of use',\n    'battery life is great i charge it once a week',\n    'it stopped charging after one month',\n    'charging is slow and the battery drains fast',\n    'the charger broke after two weeks',\n    'battery drains overnight even when the phone is idle',\n    'i have to charge it twice a day now',\n    'fast charging works well and the battery lasts all day',\n    'the battery died completely and will not charge',\n    'battery is fine but the charger gets very hot',\n    'shipping took ten days and the tracking never updated',\n    'the package arrived four days late',\n    'delivery was fast and the box was in perfect condition',\n    'my package says delivered but i never received it',\n    'shipping is slow it took a week to arrive',\n    'the box arrived damaged and the screen was broken',\n    'tracking shows it is still in transit after nine days',\n    'delivered one day early and well packed',\n    'the shipping label was wrong and it went to another city',\n    'two weeks late and nobody told me why',\n    'i returned it and the refund never came',\n    'refund was processed in three days thank you',\n    'support did not answer my email for a week',\n    'i want my money back the refund is late',\n    'customer service called me back and fixed it',\n    'returned the item ten days ago still no refund',\n    'they refunded the money after two phone calls',\n    'support sends the same reply every time useless',\n    'the refund arrived quickly good service',\n    'i am still waiting for the return label',\n]\n\ntf = TfidfVectorizer(stop_words='english')\nT = tf.fit_transform(reviews)\nwords = tf.get_feature_names_out()\n\nnmf = NMF(n_components=3, init='nndsvda', random_state=0).fit(T)\nfor k, comp in enumerate(nmf.components_):\n    print(k, [words[i] for i in comp.argsort()[::-1][:5]])", "out": "0 ['refund', 'late', 'days', 'returned', 'arrived'] / 1 ['battery', 'charging', 'fast', 'charge', 'day'] / 2 ['shipping', 'took', 'tracking', 'days', 'updated'] —— 退款、续航、物流，三件事自己分开了"}, {"text": "换 LDA 再跑一次，然后用 coherence 判谁的主题更「像个主题」。", "code": "import numpy as np\nfrom sklearn.decomposition import LatentDirichletAllocation\nfrom sklearn.metrics.pairwise import cosine_similarity\n\ndef coherence(comp, T, n=6):\n    idx = comp.argsort()[-n:]\n    sim = cosine_similarity(T[:, idx].toarray().T)\n    return float(sim[np.triu_indices(n, 1)].mean())\n\nlda = LatentDirichletAllocation(n_components=3, random_state=0).fit(T)\nprint('NMF', [round(coherence(c, T), 3) for c in nmf.components_])\nprint('LDA', [round(coherence(c, T), 3) for c in lda.components_])", "out": "NMF [0.272, 0.298, 0.403] / LDA [0.278, 0.258, 0.142] —— 平均 0.32 对 0.23，这批数据 NMF 的主题更聚；LDA 低到 0.14 那个主题是混的"}, {"text": "最后一步：拿一条新评论，说出它属于哪个主题、凭什么。", "code": "q = 'the battery dies after two hours'\nw = nmf.transform(tf.transform([q]))[0]\nk = int(w.argmax())\nprint('topic', k, 'weight', round(float(w[k]), 2))\nprint([words[i] for i in nmf.components_[k].argsort()[::-1][:5]])", "out": "topic 1 weight 0.3 / ['battery', 'charging', 'fast', 'charge', 'day'] —— 翻成人话：这条里有 battery、charging、charge，所以落在「续航/充电」主题上"}], "quiz": [{"q": "NMF 跑出 3 个主题，怎么判断它靠不靠谱？", "a": "先人眼看每个主题前 5–8 个词是否在讲同一件事，再算 coherence 和别的模型或主题数比。只看重建误差不够。"}, {"q": "主题 2 的词是 days、took、week、updated、tracking，你会给它起什么名字，业务方拿它干嘛？", "a": "物流时效。可以按月统计各主题的占比，看投诉是不是集中在配送，而不是笼统地说「体验不好」。"}, {"q": "老板问「这条为什么被判成抱怨」，什么回答才算解释？", "a": "给出词级证据：因为出现 refund、late、waiting，而且这些词在这类文本里权重最高。只答「模型算出来的」不算。"}], "can": "把一批评论文本自动分成几个能说出名字的主题，并用具体的词向业务方解释每一条的去向。"}]}], "intro": {"why": "把一堆文本（评论、工单、新闻）变成能统计、能分类、能解释的东西。", "do": ["在 500 条评论里，五分钟看出大家在抱怨什么", "搭一个分类器，并给出一个可信的准确率", "把「模型为什么这么判」讲给不写代码的同事听"], "who": "手里有文本数据 / 做运营分析 / 想入门 NLP", "need": "完全零基础可以：前 3 关补 Python，第 1 关只用到 count 和 plot", "time": "5 关 + 3 关起步，约 3.5 小时", "not": "不训练大模型、不深入 Transformer 结构", "first": "文本分析 80% 的工作在第 1、2 关：看清数据和清洗；模型只占 20%。", "next": ["把一批真实评论/工单跑一遍，产出一页结论", "往下走：embedding 检索、向量库、多标签分类", "再往后：接上 LLM 做摘要与抽取，形成完整流水线"]}}, {"id": "cpp", "name": "C++ 线", "sub": "6 关 · 对应《Learning Modern C++ for Finance》", "stages": [{"id": "c1", "name": "第 1 阶段 · 能编译", "hint": "先把 hello 跑起来，再让数字跑得比 Python 快", "lessons": [{"id": "start", "title": "从打开终端开始", "min": 20, "hook": "双击一个文件，它就打开了——但写程序不是双击。你要先学会「在终端里命令电脑做事」，这一步过了，后面才谈得上代码。", "goals": ["打开终端，知道它和鼠标点击的区别", "装好 Python 并跑通第一行输出", "读懂最常见的三种报错，不再一报错就慌", "分清 shell 和 Python 解释器：知道代码该交给谁执行"], "concepts": [{"t": "终端", "en": "terminal", "d": "一个只能打字、不能点的窗口。你输入命令，电脑执行并把结果打在下面。Windows 上叫「命令提示符」或「PowerShell」。"}, {"t": "解释器", "en": "interpreter", "d": "一个能把你的 .py 文件翻译成电脑动作的程序。装了 Python，就等于装了这个解释器。"}, {"t": "报错", "en": "traceback", "d": "程序出错时打印的说明。最后一行是错误类型，往上找第一处「你自己写的文件名」，就是出事的地方。"}], "steps": [{"text": "按 Win 键，输入 powershell，回车。出现一个可以打字的窗口，光标在闪，就对了。", "code": "powershell", "out": "一个没有按钮、只有文字的窗口"}, {"text": "确认电脑里有没有 Python。没有就用下面第一行装（需要联网几分钟）。", "code": "python --version\n# 若提示找不到命令：\nwinget install -e --id Python.Python.3.12", "out": "Python 3.12.x"}, {"text": "新建一个文件 hello.py（记事本另存为，注意后缀是 .py），写一行，然后在终端里运行它。", "code": "print(\"你好\")\n\n# 终端里，先 cd 到文件所在目录，再：\npython hello.py", "out": "你好"}, {"text": "第一个坑：不要在 PowerShell 里直接敲 Python 代码。PowerShell 自己有个 print 命令（意思是「发给打印机」），所以会报「无法初始化设备 PRN」——这不是 Python 的错，是你在错误的窗口里说话。", "code": "print(\"你好\")\n# PowerShell 里的结果：\n# 无法初始化设备 PRN\n\n# 正确做法一：先进入解释器\npython\n>>> print(\"你好\")\n>>> exit()\n\n# 正确做法二：写进 .py 文件再运行\npython hello.py", "out": "你好"}, {"text": "故意写错一次，看报错长什么样——这比跑对更重要。", "code": "print(nihao)", "out": "NameError: name 'nihao' is not defined —— 意思是「没定义过这个名字」"}], "quiz": [{"q": "为什么不能双击 .py 文件来运行？", "a": "双击只是打开编辑器；要让它执行，得用解释器运行（python 文件名）。终端就是你和解释器之间的入口。"}, {"q": "SyntaxError 和 NameError 有什么区别？", "a": "SyntaxError = 语法写错了（少括号、少引号），程序根本没开始跑；NameError = 语法没问题，但你用了一个没定义的名字。"}, {"q": "报错信息那么长，先看哪一行？", "a": "先看最后一行（错误类型和原因），再往上找第一个出现你自己文件名的行号。"}, {"q": "在 PowerShell 里直接敲 print(\"你好\")，为什么报的是「无法初始化设备 PRN」？", "a": "因为 PowerShell 把 print 当成了自己的别名（Out-Printer，发给打印机），代码根本没交给 Python。要么先用 python 进入解释器（>>> 提示符），要么写进 .py 文件用 python 文件名运行。"}], "can": "在终端里跑通自己的第
